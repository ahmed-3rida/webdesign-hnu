/*END-PALETTES-CSS*/
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.85;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
.floor{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:-1;pointer-events:none;perspective:220px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
.floor i{position:absolute;left:-50%;right:-50%;top:0;height:200%;transform-origin:top;transform:rotateX(62deg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;animation:floor 2.4s linear infinite}
@keyframes floor{to{background-position:0 40px}}
a{color:var(--acc)}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-pixel);font-weight:400;line-height:1.6;text-wrap:balance;margin:0}
h1{font-size:clamp(18px,4vw,30px)}
h2{font-size:clamp(14px,2.6vw,18px);color:var(--hl)}
h3{font-size:12px;color:var(--acc);letter-spacing:.5px}
p{margin:.4em 0}

<script>
/* ============ routing mode (hash in preview, real paths when self-hosted) ============ */
const ROUTE_META=document.querySelector('meta[name="mmd-route"]');
const STATIC=!!ROUTE_META;
const U=h=>STATIC?(h==="home"?"/":"/"+h+"/"):"#"+h;

/* ============ storage ============ */
const store={get(k,d){try{const v=localStorage.getItem("wd:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("wd:"+k,JSON.stringify(v))}catch(e){}}};
let XP=store.get("xp",0);
const xpEl=document.getElementById("xp"); xpEl.textContent=XP;

const themeB=document.getElementById("themeB"),palP=document.getElementById("palP");
const root=document.documentElement;
function curTheme(){const t=root.getAttribute("data-theme");return t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function curMode(){return root.getAttribute("data-theme")||"auto"}
function curPal(){return root.getAttribute("data-pal")||"arcade"}
function setMode(m){if(m==="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",m);try{m==="auto"?localStorage.removeItem("wd:theme"):localStorage.setItem("wd:theme",m)}catch(e){}renderPal()}
function setPal(k){if(k==="arcade")root.removeAttribute("data-pal");else root.setAttribute("data-pal",k);try{localStorage.setItem("wd:pal",k)}catch(e){}renderPal()}
function renderPal(){const th=curTheme(),m=curMode(),p=curPal();
  document.getElementById("pmodes").innerHTML=[["auto","AUTO"],["light","LIGHT"],["dark","DARK"]].map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${m===k}">${l}</button>`).join("");
  document.getElementById("pgrid").innerHTML=`<span class="ptitle">${th==="dark"?"DARK":"LIGHT"} PALETTES</span>`+PALS.map(x=>`<button type="button" data-p="${x.k}" aria-pressed="${p===x.k}"><span class="sws">${(th==="dark"?x.d:x.l).map(c=>`<i style="background:${c}"></i>`).join("")}</span>${x.n}</button>`).join("");
  palP.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  palP.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{setPal(b.dataset.p);say(`اخترت <b dir="ltr">${PALS.find(x=>x.k===b.dataset.p).n}</b>. شكلها حلو!`,"happy")});
  starCols()}
function openPal(o){palP.hidden=!o;themeB.setAttribute("aria-expanded",o);if(o)renderPal()}
themeB.onclick=e=>{e.stopPropagation();openPal(palP.hidden)};
palP.onclick=e=>e.stopPropagation();
document.addEventListener("click",()=>{if(!palP.hidden)openPal(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!palP.hidden){openPal(false);themeB.focus()}});
function syncThemeB(){starCols()}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(!palP.hidden)renderPal();starCols()});

"1":{title:"Introduction to Web Design",ar:"مقدمة في تصميم المواقع",sub:"Web Design vs Development · UI vs UX · Website Components · Types · 5 Design Stages",
hello:"أول محاضرة: يعني إيه Web Design، والفرق بين UI و UX، ومراحل التصميم الخمسة.",
html:`
<section class="sec px"><h2>1. Course Overview</h2>
<p>المادة مش هدفها إنك تعمل صفحة شكلها حلو وخلاص. الهدف إنك تفهم الموقع مكون من إيه، والديزاينر بيفكر إزاي، وإزاي الفكرة بتتحول لـ ${T("interactive website interface")}.</p>
<h3>أهداف المادة</h3>
<ol class="l">
<li>فهم مفهوم الـ Web Design ومكوناته الأساسية.</li>
<li>تطبيق أسس ومبادئ الـ ${T("graphic design")} على صفحات الويب.</li>
<li>استخدام ${T("Photoshop")} و ${T("Illustrator")} و ${T("Adobe XD")} في تصميم المواقع.</li>
<li>تصميم الـ ${T("visual identity")} وعناصر الـ ${T("user interface")}.</li>
<li>فهم أسس الـ ${T("responsive design")} لأحجام الشاشات المختلفة.</li>
<li>تنمية التفكير الإبداعي وحل مشاكل التصميم.</li>
<li>تنفيذ ${T("integrated web project")} يطبق كل المهارات.</li>
</ol>
<p>أساس الـ Web Design 3 أفكار: ${T("the idea")} (الموقع معمول ليه)، ${T("the interface")} (شكله واليوزر بيتعامل معاه إزاي)، و${T("the user experience")} (إحساس الاستخدام).</p>
</section>

<section class="sec px"><h2>2. What Happens When You Open a Website?</h2>
<p>لما حد يفتح موقع بيحصل 4 حاجات بالترتيب:</p>
<div class="pipe"><div class="st"><small>1</small><b>Sees</b>بيشوف الصفحة</div><div class="st"><small>2</small><b>Understands</b>بيفهم هي بتقدم إيه</div><div class="st"><small>3</small><b>Navigates</b>بيروح للي محتاجه</div><div class="st"><small>4</small><b>Interacts</b>بيتفاعل معاها</div></div>
<p>الصفحة غالباً مكونة من: logo، menu، images، buttons و text.</p>
<p>اليوزر بيشوف الموقع ${T("one complete whole")}، لكن الديزاينر بيشوفه عناصر متخططة ومترتبة بقصد: كل button ليه function، كل صورة ليها role، مكان العنوان مش عشوائي، وحتى الـ ${T("empty spaces")} ليها هدف.</p>
</section>

<section class="sec px"><h2>3. What Is Web Design?</h2>
<div class="def"><b>Web design</b> is the planning and design of the visual interfaces of websites, with the aim of presenting content and services in a way that is <b>clear, attractive and easy to use</b>.</div>
<p>يعني هو عملية تنظيم الـ ${T("content")} والـ ${T("visual elements")} والـ ${T("interactive elements")} جوه الموقع.</p>
<div class="tip">الـ Web Design <b>مش Photoshop بس</b> ومش رسم صفحة على الكمبيوتر. الـ web designer بيصمم <b>تجربة كاملة</b> لليوزر.</div>
<h3>Web Design vs Website Development</h3>
<div class="tbl"><table>
<tr><th></th><th>Web Design</th><th>Website Development</th></tr>
<tr><td>الاهتمام الأساسي</td><td>Appearance & experience</td><td>Technical construction & operation</td></tr>
<tr><td>المواضيع</td><td class="ltr">Appearance (look) · Layout (planning) · Interaction · User experience</td><td class="ltr">Programming · Functions · Databases · Running the website</td></tr>
</table></div>
<p>الاتنين <b>مختلفين لكن مكملين لبعض</b>: الديزاينر بيقرر الموقع شكله إيه وبيشتغل إزاي، والـ developer بيبني التكنولوجيا اللي بتشغله.</p>
<h3>Web Design vs Graphic Design</h3>
<p>الـ web designer محتاج أساس قوي في الـ graphic design، لأن قواعده بتتستخدم تاني: ${T("color, typography, composition, images, identity")}. الفرق إن الـ web design <b>مش static</b>؛ اليوزر بيتفاعل معاه، فلازم يتصمم للاستخدام والحركة.</p>
</section>

<section class="sec px"><h2>4. UI and UX</h2>
<div class="two">
<div class="card"><span class="k">UI · User Interface</span><p>كل حاجة اليوزر بيشوفها وبيتفاعل معاها: colors, fonts, buttons, images, spaces. بنقيسها بـ 3 أسئلة:<br><b>Visual:</b> الشكل والهوية؟<br><b>Interaction:</b> إيه اللي يتداس عليه؟<br><b>Clarity:</b> الرسالة واضحة؟</p></div>
<div class="card"><span class="k">UX · User Experience</span><p>اليوزر بيحس بإيه وهو بيستخدم الموقع، وبيوصل لهدفه بسهولة وثقة ولا لأ. صفاته:<br>Ease of understanding · Ease of navigation · Speed of reaching the goal · Comfort & trust</p></div>
</div>
<div class="tbl"><table>
<tr><th></th><th>UI</th><th>UX</th></tr>
<tr><td>Key question</td><td class="ltr">How does the website look?</td><td class="ltr">How does the experience work?</td></tr>
<tr><td>Focus</td><td class="ltr">Form · color · interaction</td><td class="ltr">Understanding · movement · reaching the goal</td></tr>
<tr><td>Activities</td><td class="ltr">Visual design, colors, graphic design, layouts, typography</td><td class="ltr">User research, scenarios, information architecture, wireframes & prototypes, interaction design</td></tr>
</table></div>
<div class="tip">interface حلوة من غير experience واضحة ممكن تلخبط اليوزر، و experience كويسة محتاجة interface تعبر عنها. <b>الموقع الناجح محتاج الاتنين.</b></div>
</section>

<section class="sec px"><h2>5. Components of a Website</h2>
<div class="tbl"><table>
<tr><th>Component</th><th>Role</th><th>الوصف</th></tr>
<tr><td class="ltr">Header</td><td class="ltr">Start of the page & identity</td><td>أعلى الصفحة، فيه الـ logo واسم الموقع.</td></tr>
<tr><td class="ltr">Navigation</td><td class="ltr">Moving between pages</td><td>المنيو اللي بتنقلك بين الصفحات.</td></tr>
<tr><td class="ltr">Hero Section</td><td class="ltr">The first message</td><td>أول مساحة كبيرة الزائر بيشوفها؛ بتوصل الرسالة الأساسية.</td></tr>
<tr><td class="ltr">Call to Action (CTA)</td><td class="ltr">The next step</td><td>button أو link بيدعي اليوزر ياخد الخطوة الجاية.</td></tr>
<tr><td class="ltr">Footer</td><td class="ltr">Closing information</td><td>آخر الصفحة: معلومات ختامية و secondary links.</td></tr>
</table></div>
</section>

<section class="sec px"><h2>6. Types of Websites</h2>
<p>كل موقع ليه ${T("goal")} و ${T("target user")}، والتصميم لازم يمشي وراهم.</p>
<div class="cards">
<div class="card"><span class="k">Portfolio</span><p>عرض الشغل والهوية.</p></div>
<div class="card"><span class="k">Business</span><p>تقديم شركة أو خدمة.</p></div>
<div class="card"><span class="k">E-commerce</span><p>بيع وشراء المنتجات.</p></div>
<div class="card"><span class="k">Educational</span><p>التعليم ونشر المعرفة.</p></div>
<div class="card"><span class="k">Non-profit</span><p>خدمة قضية أو مجتمع مش ربح.</p></div>
<div class="card"><span class="k">Media</span><p>نشر الأخبار والمحتوى الإعلامي.</p></div>
<div class="card"><span class="k">Entrepreneur (Infopreneur)</span><p>خدمة رواد الأعمال، غالباً ببيع معلومات أو خبرة.</p></div>
</div>

<div class="pipe"><div class="st"><small>1</small><b>Browse</b>تتفرج على المنتجات</div><div class="st"><small>2</small><b>Compare</b>تقارن الاختيارات</div><div class="st"><small>3</small><b>Add to cart</b>تضيف للسلة</div><div class="st"><small>4</small><b>Checkout</b>تكمل الشراء</div></div>
<h3>Educational: Student Journey</h3>
<div class="pipe"><div class="st"><small>1</small><b>Discover</b>يدور على الموضوع</div><div class="st"><small>2</small><b>Learn</b>يتابع الدرس</div><div class="st"><small>3</small><b>Practice</b>يطبق اللي اتعلمه</div></div>
<div class="tip">e-commerce = <b>4 خطوات</b> (Browse → Compare → Add to cart → Checkout)، و educational = <b>3 خطوات</b> (Discover → Learn → Practice).</div>
</section>

<section class="sec px"><h2>7. Stages of Website Design</h2>
<p>5 مراحل، كل مرحلة بتجاوب على سؤال، ولو نطيت مرحلة غالباً هيحصل لخبطة بعدين.</p>
<div class="tbl"><table>
<tr><th>#</th><th>Stage</th><th>Purpose</th><th>Main question</th></tr>
<tr><td>1</td><td class="ltr">Research</td><td>فهم المشروع واليوزر</td><td class="ltr">Who? Why? What?</td></tr>
<tr><td>2</td><td class="ltr">Structure</td><td>تنظيم المحتوى</td><td class="ltr">How are the pages organized?</td></tr>
<tr><td>3</td><td class="ltr">Wireframe</td><td>رسم هيكل الصفحات</td><td class="ltr">Where does each element go?</td></tr>
<tr><td>4</td><td class="ltr">Visual Design</td><td>بناء الشكل</td><td class="ltr">How should it look?</td></tr>
<tr><td>5</td><td class="ltr">Prototype</td><td>اختبار التفاعل</td><td class="ltr">Is the path understandable and usable?</td></tr>
</table></div>
<h3>1. Research</h3>
<p>قبل ما ترسم أي شاشة: ${T("Who?")} مين اليوزر، ${T("Why?")} الهدف إيه، ${T("What?")} محتاجين أنهي content و functions.</p>
<div class="tip">"Good design starts with good questions, <b>not with opening the design software</b>."</div>
<h3>2. Structure</h3>
<p>المعلومات بتتحول لـ ${T("site map")}: إيه الصفحات الرئيسية؟ مربوطة ببعض إزاي؟ إيه الأولوية في كل شاشة؟ مسار اليوزر المتوقع إيه؟</p>
<h3>3. Wireframe</h3>
<p>${T("simplified sketch")} بيركز على الـ structure والـ content <b>قبل الألوان والصور</b>. بيتعامل مع 3 حاجات: ${T("Layout")} (كل عنصر فين)، ${T("Hierarchy")} (بنشوف إيه الأول)، ${T("Flow")} (بنتحرك بين الصفحات إزاي). ممكن يبقى hand-drawn أو digital.</p>
<h3>4. Visual Design</h3>
<div class="tbl"><table>
<tr><th>Program</th><th>Main use</th><th>Details</th></tr>
<tr><td class="ltr">Adobe Photoshop</td><td class="ltr">Image & visual processing</td><td>تحسين الصور، الـ mood والألوان.</td></tr>
<tr><td class="ltr">Adobe Illustrator</td><td class="ltr">Logos & vector graphics</td><td>logo و identity، icons و illustrations، عناصر vector واضحة في أي size.</td></tr>
<tr><td class="ltr">Adobe XD</td><td class="ltr">Interfaces & interactive models</td><td>تصميم الشاشة، ربط الشاشات، واختبار المسار.</td></tr>
</table></div>
<h3>5. Prototype</h3>
<p>في XD: ${T("Design")} the screen → ${T("Link")} the screens → ${T("Test")} the path.</p>
<div class="two">
<div class="card"><span class="k">Static Design</span><p>صورة ثابتة بتوري الشكل النهائي. بتختبر الـ <b>appearance</b>.</p></div>
<div class="card"><span class="k">Prototype</span><p>نسخة clickable بتوري الحركة والتفاعل. بتختبر إن المسار <b>understandable and usable</b>.</p></div>
</div>
<div class="tip">الـ prototype <b>مش بيختبر الجمال بس</b>؛ بيختبر هل مسار اليوزر مفهوم وقابل للاستخدام.</div>
</section>

<section class="sec px"><h2>8. Case Study: Museum Website</h2>
<p>سؤال المحاضرة: لو بتصمم موقع متحف، إيه أول عنصر تحطه في الـ Hero؟ الاختيارات كانت: صورة ${T("artifact")}، أو مواعيد الزيارة، أو المعرض الحالي.</p>
<p>الهدف: الزائر ${T("discovers the exhibition")}، ${T("understands the piece")}، و${T("plans the visit")}.</p>
<div class="tbl"><table>
<tr><th>Component</th><th>Content for the museum website</th></tr>
<tr><td class="ltr">Hero</td><td class="ltr">The current exhibition, distinguished pieces, the museum building</td></tr>
<tr><td class="ltr">Navigation</td><td class="ltr">Exhibitions · Visit · Collections</td></tr>
<tr><td class="ltr">Content</td><td class="ltr">The story of each piece, with its images</td></tr>
<tr><td class="ltr">CTA</td><td class="ltr">Book your visit</td></tr>
</table></div>
</section>

<section class="sec px"><h2>9. The Semester Plan</h2>
<div class="pipe"><div class="st"><small>1</small><b>Photoshop</b>Images & visual assets</div><div class="st"><small>2</small><b>Illustrator</b>Vector graphics & icons</div><div class="st"><small>3</small><b>Adobe XD</b>UI & prototyping</div><div class="st"><small>FINAL</small><b>Final Project</b>Design a complete website</div></div>
</section>`},

"2":{title:"Web Layout & Structural Design",ar:"الـ Layout والهيكل باستخدام Illustrator",sub:"Workflow · Web Layout · Page Components · Grid System · Layout Types · Visual Hierarchy · Illustrator",
hello:"المحاضرة دي عن الهيكل قبل الألوان. جرب الـ 12-column grid demo تحت.",
html:`
<section class="sec px"><h2>1. Workflow: From Idea to Web Page</h2>
<div class="pipe"><div class="st"><small>1</small><b>Idea</b>فكرة الموقع</div><div class="st"><small>2</small><b>Structure</b>تحديد المحتوى</div><div class="st"><small>3</small><b>Layout</b>تنظيم الصفحة</div><div class="st"><small>4</small><b>Visual Design</b>الشكل</div><div class="st"><small>5</small><b>Prototype</b>التفاعل</div></div>
<p>مفيش موقع ناجح بيبدأ بالألوان والصور. بيبدأ بفهم المحتوى وتنظيمه. مرحلة الـ ${T("Layout")} بتيجي <b>بعد فهم المحتوى</b> و<b>قبل اختيار الـ fonts والألوان والصور النهائية</b>.</p>
<p>المصطلحات الأساسية: ${T("Web Layout")}، ${T("Grid System")}، ${T("Page Structure")}، ${T("Visual Hierarchy")}، ${T("Structural Layout")}.</p>
</section>

<section class="sec px"><h2>2. What Is Web Layout?</h2>
<div class="def"><b>Web Layout</b> is the way in which the elements inside a web page are <b>organized and distributed</b> to achieve clarity and ease of browsing. It is the <b>visual structure</b> of the page.</div>
<h3>The 5 pillars</h3>
<div class="cards">
<div class="card"><span class="k">Position</span><p>كل عنصر متحط فين.</p></div>
<div class="card"><span class="k">Size</span><p>حجم كل عنصر.</p></div>
<div class="card"><span class="k">Spacing</span><p>المسافة بين وحوالين العناصر.</p></div>
<div class="card"><span class="k">Alignment</span><p>العناصر مترصصة مع بعض إزاي.</p></div>
<div class="card"><span class="k">Hierarchy</span><p>ترتيب الأهمية بين العناصر.</p></div>
</div>
<div class="tip">الديزاينر مش بيسأل "هنحط إيه في الصفحة؟"، بيسأل 3 أسئلة: <b>هيتحط فين؟ هيبقى حجمه قد إيه؟ علاقته بباقي العناصر إيه؟</b></div>
</section>

<section class="sec px"><h2>3. Components of a Web Page</h2>
<div class="tbl"><table>
<tr><th>Component</th><th>Role</th></tr>
<tr><td class="ltr">Header</td><td>أعلى الصفحة: الهوية والأدوات الأساسية (logo, brand name, search, user actions). أول حاجة اليوزر بيشوفها فلازم تبقى واضحة.</td></tr>
<tr><td class="ltr">Navigation</td><td>التنقل بين الصفحات: تتنقل، تعرف انت فين في الموقع، وتوصل للمحتوى بسهولة.</td></tr>
<tr><td class="ltr">Hero Section</td><td>منطقة بارزة في أول الصفحة فيها الرسالة الأساسية.</td></tr>
<tr><td class="ltr">Main Content</td><td>المنطقة الأساسية للمعلومات.</td></tr>
<tr><td class="ltr">Sidebar</td><td>منطقة جانبية لمعلومات إضافية أو navigation إضافي.</td></tr>
<tr><td class="ltr">Footer</td><td>links ومعلومات إضافية و social media ووسائل التواصل.</td></tr>
</table></div>
<div class="tip">مش كل موقع لازم يبقى فيه كل الأجزاء دي. والفرق: <b>Header = identity & tools</b>، و <b>Navigation = يساعد الزائر يلاقي طريقه</b>.</div>
<h3>Hero Section</h3>
<p>ممكن يكون فيها: ${T("Main image")}، ${T("Headline")}، ${T("Short description")}، و ${T("Call to Action (CTA)")}.</p>
<p>الـ Hero <b>مش مجرد صورة كبيرة</b>؛ هي منطقة ليها function: بتقدم فكرة الموقع أو أهم رسالة. مثال موقع سياحي: صورة المكان، اسمه، جملة تعريفية، وزرار اشتراك.</p>
</section>

<section class="sec px"><h2>4. Grid System</h2>
<p>الـ grid بيساعد الديزاينر: ينظم العناصر، يحقق alignment، يتحكم في الـ spacing، يحقق consistency، ويخلي الصفحة أسهل في القراءة. هو ${T("invisible network")}؛ اليوزر مش بيشوفه لكن بيحس بنتيجته.</p>
<div class="tbl"><table>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td class="ltr">Columns</td><td>التقسيمات الرأسية اللي المحتوى بيتحط فيها.</td></tr>
<tr><td class="ltr">Rows</td><td>الشرايط الأفقية للمحتوى.</td></tr>
<tr><td class="ltr">Gutters</td><td>المسافات <b>بين</b> الأعمدة.</td></tr>
<tr><td class="ltr">Margins</td><td>المسافة بين المحتوى و<b>أطراف</b> الصفحة.</td></tr>
</table></div>
<h3>The 12-column grid</h3>
<p>الـ 12-column grid <b>مش معناه</b> إنك لازم تحط 12 عنصر. ده نظام ${T("flexible")} بيسمح تقسم المساحة بطرق مختلفة وتحافظ على الـ alignment.</p>
<div class="demo"><span class="lab">DEMO: DIVIDE THE 12 COLUMNS</span>
<div class="chips" id="gchips"></div>
<div class="g12" id="g12"></div>
<p id="gnote" style="margin:0"></p></div>
<div class="tip">أي تقسيمة لازم مجموعها <b>12</b>: 6+6، 4+8، 3+9، 4+4+4، 3+6+3.</div>
<h3>Negative space</h3>
<p>من أشهر أخطاء المبتدئين إنه يقرب العناصر من بعض زيادة. المسافات <b>مش فراغ ضايع</b>؛ الـ ${T("negative spaces")} (margins, gutters, padding) هي ${T("functional visual design tools")}.</p>
</section>

<section class="sec px"><h2>5. Types of Web Page Layouts</h2>
<p>الاختيار بيعتمد على طبيعة المحتوى: صفحة مقال غير صفحة متجر، وصفحة gallery غير صفحة مؤسسة.</p>
<div class="cards">
<div class="card"><span class="k">Single Column</span><p>عمود واحد لمحتوى متسلسل.</p></div>
<div class="card"><span class="k">Two Column</span><p>main content + sidebar.</p></div>
<div class="card"><span class="k">Three Column</span><p>توزيع أوسع للمحتوى.</p></div>
<div class="card"><span class="k">Grid Layout</span><p>grid مرن لعناصر كتير.</p></div>
<div class="card"><span class="k">Card-based</span><p>قطع محتوى مستقلة جوه cards.</p></div>
</div>
<p>أنواع تانية في الصورة: split screen, asymmetrical, F-shape, Z-shape, featured image, masonry, magazine, fixed navigation, hidden navigation, interactive.</p>
</section>

<section class="sec px"><h2>6. Visual Hierarchy</h2>
<div class="def"><b>Visual hierarchy</b> is arranging the elements according to their <b>visual importance</b>. The eye moves between elements according to the importance the designer created.</div>
<div class="tbl"><table>
<tr><th>Tool</th><th>Effect</th></tr>
<tr><td class="ltr">Size</td><td>العنصر الأكبر بيشد العين الأول.</td></tr>
<tr><td class="ltr">Position</td><td>مكان العنصر بيأثر على إمتى يتلاحظ.</td></tr>
<tr><td class="ltr">Contrast</td><td>الاختلاف بيبرز الأولوية.</td></tr>
<tr><td class="ltr">Spacing</td><td>المسافة بتنظم المجموعات.</td></tr>
<tr><td class="ltr">Typography</td><td>الخط بيوجه القراءة.</td></tr>
<tr><td class="ltr">Image</td><td>الصورة بتعمل نقطة جذب.</td></tr>
</table></div>
</section>

<section class="sec px"><h2>7. From Layout to Illustrator</h2>
<div class="tbl"><table>
<tr><th>Step</th><th>Action</th><th>Purpose</th></tr>
<tr><td>01</td><td class="ltr">Create New Document</td><td>ملف جديد مناسب للمشروع.</td></tr>
<tr><td>02</td><td class="ltr">Artboard</td><td>تحديد الـ artboard وحجم الصفحة.</td></tr>
<tr><td>03</td><td class="ltr">Grid</td><td>عمل الـ grid وتحديد الـ margins.</td></tr>
<tr><td>04</td><td class="ltr">Guides</td><td>guides للـ alignment.</td></tr>
<tr><td>05</td><td class="ltr">Layers</td><td>تنظيم الـ layers عشان التعديل يبقى سهل.</td></tr>
</table></div>
<p>الـ ${T("Rectangular Grid Tool")} بيعمل grid من rows و columns تستخدمه كمرجع. والـ structure بيتبني بـ rectangles و simple shapes و guides و text placeholders.</p>
<h3>Hands-on: Homepage</h3>
<p>الأقسام: Header، Navigation، Hero، Content Sections، Cards، Footer.</p>
<div class="pipe"><div class="st"><small>1</small><b>Artboard</b></div><div class="st"><small>2</small><b>Grid</b></div><div class="st"><small>3</small><b>Sections</b></div><div class="st"><small>4</small><b>Alignment</b></div><div class="st"><small>5</small><b>Spacing</b></div></div>
<p>التمرين <b>مش</b> بيطلب ألوان وصور نهائية؛ بيطلب ${T("organized structure")} تتطور بعدين. ولو الصفحة طالعة unbalanced من غير grid، الحل ${T("establish a grid and use guides")} مش إنك تزود ألوان.</p>
<h3>Assignment</h3>
<p>اختار فكرة (Portfolio / Education / Museum) واعمل ${T("Homepage Structural Layout")} بـ Artboard, Grid, Guides, Shapes, Alignment, Spacing، <b>من غير ألوان ومن غير صور نهائية</b>.</p>
<h3>Course workflow</h3>
<p class="ltr">Illustrator structural layout → XD wireframe / prototype → Photoshop image preparation → Illustrator visual design → XD final interactive prototype</p>
</section>

<section class="sec px"><h2>8. Choosing the Layout by Context</h2>
<p>مفيش layout واحد ينفع للكل: ${T("goal, audience, content")} هم اللي بيحددوا.</p>
<div class="tbl"><table>
<tr><th>Website</th><th>Priority</th><th>Layout decision</th></tr>
<tr><td class="ltr">Museum</td><td>${T("Emotional visual experience")}: صور عالية الجودة، معلومات عملية (tickets, hours, prices, events)، virtual tours.</td><td>مساحة أكبر للصورة، ومسارات واضحة للزيارة والاستكشاف.</td></tr>
<tr><td class="ltr">University</td><td>${T("Information architecture & comprehensiveness")}: جمهور متنوع، student portal و timetables، ${T("mega menus")}، و internal search.</td><td>الثقة بتيجي من الوضوح وسهولة الوصول.</td></tr>
<tr><td class="ltr">Personal portfolio</td><td>${T("Identity & quick persuasion")}: gallery للشغل، CV و recommendations كـ ${T("social proof")}.</td><td>القصة: identity → evidence → next step، و CTA واحد واضح.</td></tr>
</table></div>
</section>`},

"3":{title:"Website Elements & Visual Identity",ar:"عناصر الموقع والهوية البصرية",sub:"3 Layers · Interface Elements · Principles · 12-col · 8px · Containers · Breakpoints · Site Types · Illustrator",
hello:"المحاضرة دي مليانة أرقام: 8px و breakpoints و containers. ركز في الجداول.",
html:`
<section class="sec px"><h2>1. From Structure to Element</h2>
<div class="tbl"><table>
<tr><th>Layer</th><th>Role</th></tr>
<tr><td class="ltr">Visual structure</td><td>بيحدد <b>أماكن</b> العناصر.</td></tr>
<tr><td class="ltr">Visual design</td><td>بيدي الـ logo والـ icons والـ buttons شكلها ووظيفتها.</td></tr>
<tr><td class="ltr">Visual identity</td><td>بيـ<b>وحّد</b> الألوان والخطوط والعناصر في كل الصفحات.</td></tr>
</table></div>
</section>

<section class="sec px"><h2>2. Elements of the Website Interface</h2>
<div class="tbl"><table>
<tr><th>Elements</th><th>Role</th></tr>
<tr><td class="ltr">Logo · Navigation Menu</td><td>${T("point of recognition")} ومسار الوصول جوه الصفحة.</td></tr>
<tr><td class="ltr">Buttons · Icons</td><td>${T("clear signals of action and function")}.</td></tr>
<tr><td class="ltr">Cards · Headings & Typography</td><td>بينظموا المحتوى وبيحددوا ${T("what is read first")}.</td></tr>
<tr><td class="ltr">Illustrations & Graphic Elements</td><td>بيدعموا الفكرة وبيدوا الـ interface ${T("visual presence")}.</td></tr>
</table></div>
<div class="tip">"A good element combines <b>visual clarity</b> with <b>ease of use</b>." الجملة دي متكررة في 3 محاضرات.</div>
</section>

<section class="sec px"><h2>3. One System: The Principles</h2>
<div class="tbl"><table>
<tr><th>#</th><th>Principle</th><th>Meaning</th></tr>
<tr><td>01</td><td class="ltr">Unity and coherence</td><td>كل عنصر من نفس الـ visual language.</td></tr>
<tr><td>02</td><td class="ltr">Contrast and visual hierarchy</td><td>الـ size واللون بيحددوا إيه يتشاف الأول.</td></tr>
<tr><td>03</td><td class="ltr">Alignment and consistency</td><td>${T("Shared edges")} بتخلي الـ interface مقروءة.</td></tr>
<tr><td>04</td><td class="ltr">White space</td><td>المساحة الفاضية بتوضح العلاقة بين العناصر.</td></tr>
</table></div>
<div class="tip">The working rule: مش كفاية كل عنصر يبقى حلو لوحده؛ <b>العناصر لازم تنتمي لـ system واحد</b>.</div>
</section>

<section class="sec px"><h2>4. The Layout System</h2>
<h3>12-column grid</h3>
<p>الأعمدة بتحدد عرض الـ cards والصور ومناطق المحتوى، والـ gutter والـ margin بيتحكموا في المسافات بين المناطق وأطراف الصفحة.</p>
<div class="tbl"><table>
<tr><th>Division</th><th>Use</th></tr>
<tr><td>6+6</td><td>توزيع متوازن بين منطقتين.</td></tr>
<tr><td>4+8</td><td>منطقة مساعدة جنب الـ main content.</td></tr>
<tr><td>3+6+3</td><td>المحتوى في النص و side margins.</td></tr>
<tr><td>4+4+4</td><td>3 cards متساوية.</td></tr>
</table></div>
<h3>Spacing system</h3>
<div class="cards">
<div class="card"><span class="k">Margin</span><p>المسافة <b>حوالين</b> منطقة المحتوى.</p></div>
<div class="card"><span class="k">Gutter</span><p>المسافة <b>بين</b> الأعمدة.</p></div>
<div class="card"><span class="k">Padding</span><p>المسافة <b>جوه</b> العنصر حوالين محتواه.</p></div>
</div>
<p>الـ ${T("8px system")}: القيم مضاعفات 8: <code>8 · 16 · 24 · 32 · 48 · 64</code> px. الـ fixed scale بيخلي الـ spacing consistent في الموقع كله.</p>
<div class="demo"><span class="lab">DEMO: 8PX SPACING SCALE</span>
<div class="sl"><span>gap</span><input type="range" id="spg" min="0" max="5" value="2" aria-label="Gap step"><span id="spgv">24px</span></div>
<div class="sl"><span>padding</span><input type="range" id="spp" min="0" max="5" value="1" aria-label="Padding step"><span id="sppv">16px</span></div>
<div class="spdemo" id="spd"></div></div>
<div class="tbl"><table>
<tr><th></th><th>Desktop</th><th>Mobile</th></tr>
<tr><td class="ltr">Gutter</td><td>24px</td><td>16px</td></tr>
<tr><td class="ltr">Margin</td><td>32px</td><td>20px</td></tr>
</table></div>
<h3>Container & breakpoints</h3>
<p>الـ ${T("container")} = أقصى عرض لمنطقة المحتوى، والـ ${T("breakpoints")} = عروض الشاشة اللي الـ layout بيتغير عندها. القيم دي ${T("reference values","m")} <b>مش قواعد إجبارية</b>.</p>
<div class="two">
<div class="tbl"><table><tr><th>Container</th><th>Use</th></tr><tr><td>1140px</td><td class="ltr">Reading</td></tr><tr><td>1280px</td><td class="ltr">General layouts</td></tr><tr><td>1440px</td><td class="ltr">Image-dependent designs</td></tr></table></div>
<div class="tbl"><table><tr><th>Breakpoint</th><th>Width</th></tr><tr><td class="ltr">Mobile</td><td>375px</td></tr><tr><td class="ltr">Tablet</td><td>768px</td></tr><tr><td class="ltr">Laptop</td><td>1024px</td></tr><tr><td class="ltr">Desktop</td><td>1280px</td></tr><tr><td class="ltr">Large screens</td><td>1440px</td></tr></table></div>
</div>
</section>

<section class="sec px"><h2>5. Same Grid, Different Intent</h2>
<div class="tbl"><table>
<tr><th></th><th>Educational</th><th>Museum</th><th>Portfolio</th></tr>
<tr><td>Priority</td><td>Clarity, organization, classification</td><td>Wide spaces, large images, immersive</td><td>Fewest distractions, work highlighted</td></tr>
<tr><td>Container</td><td>≈1280px</td><td>≈1440px / full width</td><td>1320–1440px</td></tr>
<tr><td>Header</td><td>64–72px</td><td>≈80px</td><td>72px</td></tr>
<tr><td>Gutter</td><td>—</td><td>32px</td><td>16–20px</td></tr>
<tr><td>Section spacing</td><td>—</td><td>120–200px</td><td>64–80px</td></tr>
<tr><td>Patterns</td><td class="ltr">Sidebar + course grid; 8+4 course page</td><td class="ltr">Editorial, Archive Grid, Timeline</td><td class="ltr">Minimal Grid, List/Index, Full-Screen, Masonry</td></tr>
</table></div>
<h3>Educational website</h3>
<p>Sidebar حوالي <b>280px</b>، و ${T("course card")}: image, title, instructor, rating. صفحة الكورس <b>8 + 4</b> والنص لحد <b>720px</b>.</p>
<div class="cards">
<div class="card"><span class="k">Marketplace</span><p>grid of courses with filters.</p></div>
<div class="card"><span class="k">LMS Dashboard</span><p>fixed curriculum list.</p></div>
<div class="card"><span class="k">Single Instructor</span><p>مدرس واحد وكورساته وآراء الطلبة.</p></div>
<div class="card"><span class="k">Gamified Learning</span><p>interactive path of lessons.</p></div>
</div>
<h3>Museum website</h3>
<div class="cards">
<div class="card"><span class="k">Editorial</span><p>صورة ونص في visual narrative متدرج.</p></div>
<div class="card"><span class="k">Archive Grid</span><p>grid منظم لاستكشاف الـ collection.</p></div>
<div class="card"><span class="k">Timeline</span><p>تصفح الأعمال والأحداث عبر الزمن.</p></div>
</div>
<h3>Portfolio website</h3>
<p>Structure: ${T("Work / About / Contact")}. <b>مشروعين في الصف، كل واحد 6 columns</b>.</p>
<div class="cards">
<div class="card"><span class="k">Minimal Grid</span><p>grid هادي يبرز الشغل.</p></div>
<div class="card"><span class="k">List / Index</span><p>قائمة سريعة في التصفح.</p></div>
<div class="card"><span class="k">Full-Screen</span><p>شغلانة واحدة مالية الشاشة.</p></div>
<div class="card"><span class="k">Masonry / Brutalist</span><p>توزيع asymmetric بتقسيمة <b>8 + 4</b>.</p></div>
</div>
</section>

<section class="sec px"><h2>6. Layout Design Checklist</h2>
<div class="two">
<div class="card"><span class="k">System</span><p>A clear grid · A suitable container · A fixed spacing system · <b>Choose the layout before the elements</b></p></div>
<div class="card"><span class="k">Verification</span><p>Basic screen sizes · Consistency between pages · Review of alignment and rhythm</p></div>
</div>
</section>

<section class="sec px"><h2>7. In Illustrator: Setting Up a Web Layout</h2>
<div class="tbl"><table>
<tr><th>Task</th><th>How</th></tr>
<tr><td>New web document</td><td>تاب <b>Web</b> في New Document: <b>Web-Large 1920×1080</b> أو <b>1440×900</b>. الوحدة <b>Pixels</b>، الـ color mode <b>RGB</b>، و Raster Effects <b>72 ppi</b> (الـ 300 ppi للطباعة).</td></tr>
<tr><td>Artboards</td><td>artboard لكل screen size (desktop و laptop مثلاً).</td></tr>
<tr><td>Rulers</td><td><kbd>Ctrl/Cmd + R</kbd>، والـ guides بتتسحب منها: من الـ ruler اللي فوق للأفقي ومن اللي على الجنب للرأسي.</td></tr>
<tr><td>Shape → guide</td><td>اختار الـ rectangle ثم <b>View &gt; Guides &gt; Make Guides</b> (و Release Guides يرجعها).</td></tr>
<tr><td>Columns with gutters</td><td><b>Object &gt; Path &gt; Split Into Grid</b>: حدد عدد الأعمدة والـ Gutter. 12 عمود فيهم <b>11 gutter</b>.</td></tr>
<tr><td>Document grid</td><td><b>View &gt; Show Grid</b> <kbd>Ctrl/Cmd + '</kbd>، والمسافات من <b>Preferences &gt; Guides &amp; Grid</b> (مثلاً 8px).</td></tr>
<tr><td>Smart Guides</td><td><kbd>Ctrl/Cmd + U</kbd>: خطوط alignment ومقاسات وانت بتحرك.</td></tr>
<tr><td>Lock guides</td><td><b>View &gt; Guides &gt; Lock Guides</b> عشان متحركهاش بالغلط.</td></tr>
</table></div>
<h3>Grayscale wireframe</h3>
<ul class="l">
<li>بيترسم <b>gray</b> الأول عشان تركز على الـ structure والـ spacing والـ hierarchy قبل الألوان.</li>
<li>${T("Rectangle Tool")} للـ header و hero و footer، ${T("Rounded Rectangle")} للزرار، و ${T("Ellipse + Shift")} للـ avatar.</li>
<li>الـ image placeholder = مستطيل gray وممكن بخطين متقاطعين.</li>
<li>الـ hierarchy بتبان بفرق الـ <b>size</b> و<b>درجة الرمادي</b>.</li>
<li>${T("Layers panel")} للأقسام (Header, Hero, Content, Footer)، و ${T("Align panel")} للـ align و distribute.</li>
<li>الترتيب: grid & guides → big blocks → details (cards, buttons, text).</li>
</ul>
</section>`},

"4":{title:"Logo Design",ar:"تصميم اللوجو",sub:"Definition · Strategy · Evolution · Criteria · Types · Ideas · Egyptian Museums · Stages · Illustrator",
hello:"اللوجو: التعريف، الـ 10 معايير، والأنواع السبعة. الأنواع دي أهم حاجة.",
html:`
<section class="sec px"><h2>1. What Is a Logo?</h2>
<div class="def">A <b>logo</b> is a symbol that expresses a <b>product, a company or a service</b>. It must deliver its message clearly to the target audience. It is also the <b>identity of the quality</b> of the service provided.</div>
<p>المحاضرة بتبدأ أول عنصر من عناصر الـ interface (Logo · Navigation، Buttons · Icons، Cards · Typography، Illustrations).</p>
</section>

<section class="sec px"><h2>2. Logo Design Strategy</h2>
<div class="cards">
<div class="card"><span class="k">Understand the business</span><p>تفهم طبيعة شغل المؤسسة عشان تصمم بدقة.</p></div>
<div class="card"><span class="k">Research the competitors</span><p>تعرف الـ visual identity بتاعتهم.</p></div>
<div class="card"><span class="k">Know the target audience</span><p>تفهم الجمهور وتفضيلاته.</p></div>
<div class="card"><span class="k">Think long term</span><p>اللوجو لازم يعيش سنين قدام التغيير والتطور.</p></div>
</div>
</section>

<section class="sec px"><h2>3. The Evolution of Logos</h2>
<p>التطور دايماً رايح ناحية ${T("simplicity and the ability to adapt")} عشان البراند يفضل في دماغ الناس.</p>
<div class="two">
<div class="card"><span class="k">Concord Museum</span><p>Concord, Massachusetts, USA. متحف تاريخ محلي + decorative arts. اتغير في <b>1990، 2003، 2023</b>: من emblem شبه الختم لـ typographic marks بسيطة.</p></div>
<div class="card"><span class="k">Natural History Museum, London</span><p>مؤسسة علمية وتعليمية. 3 نسخ: <b>before 2004</b>، <b>2004–2023</b>، <b>2023–present</b>.</p></div>
</div>
</section>

<section class="sec px"><h2>4. Criteria for Logo Design</h2>
<div class="tbl"><table>
<tr><th>Criterion</th><th>Meaning</th></tr>
<tr><td class="ltr">Meaning (relevance)</td><td>يعبر بوضوح عن المنتج أو نشاط الشركة.</td></tr>
<tr><td class="ltr">Simplicity</td><td>بسيط و<b>symbol واحد</b> مميز. الناس بتشوفه لحظة (ماشي أو في المواصلات).</td></tr>
<tr><td class="ltr">One typeface</td><td><b>نوع خط واحد</b> للعربي أو الإنجليزي، والنص متناسق.</td></tr>
<tr><td class="ltr">Limited color</td><td>لون واحد، أو اتنين بالكتير، <b>من غير gradients ولا shadows</b>.</td></tr>
<tr><td class="ltr">Works on white and black</td><td>يتستخدم على خلفية بيضا وسودا.</td></tr>
<tr><td class="ltr">Versatility</td><td>ينفع في أحجام كبيرة جداً (billboards) وصغيرة جداً (business cards, pins) من غير ما يخسر ملامحه.</td></tr>
<tr><td class="ltr">Legibility</td><td>النص يتقري بسهولة من أول نظرة.</td></tr>
<tr><td class="ltr">Distinctiveness</td><td>مميز ومختلف عشان يشد الانتباه.</td></tr>
<tr><td class="ltr">Attracting attention</td><td>يلفت النظر من أول مرة ويسيب انطباع كويس.</td></tr>
<tr><td class="ltr">Avoiding trends</td><td>متمشيش ورا الموضة عشان يتستخدم في أي وقت وأي مكان.</td></tr>
</table></div>
</section>

<section class="sec px"><h2>5. Types of Logos</h2>
<p>3 مجموعات: ${T("word-based")}، ${T("shape-based")}، و${T("word-and-shape")}.</p>
<div class="tbl"><table>
<tr><th>Group</th><th>Type</th><th>الوصف</th></tr>
<tr><td rowspan="2" class="ltr">Word-based (Wordmark / Logotype)</td><td class="ltr">Word Mark</td><td>بيميز <b>اسم البراند</b> (Google, Coca-Cola).</td></tr>
<tr><td class="ltr">Letter Mark</td><td>للبراندات ذات <b>الأسماء الطويلة</b> (IBM, CNN).</td></tr>
<tr><td rowspan="2" class="ltr">Shape-based (Symbol / Logomark)</td><td class="ltr">Logo Symbol</td><td>مميز وسهل التعرف و<b>مش محتاج نص</b> (Apple, Twitter bird).</td></tr>
<tr><td class="ltr">Abstract Mark</td><td>بيحرك المشاعر <b>من غير صورة معروفة</b>؛ للبراندات اللي عايزة تتميز (Pepsi, Nike).</td></tr>
<tr><td rowspan="3" class="ltr">Word-and-shape (Combination)</td><td class="ltr">Combination Mark</td><td>بيقوي الـ visual identity ويضمن التعرف على البراند.</td></tr>
<tr><td class="ltr">Emblem Logo</td><td>إحساس <b>traditional & trustworthy</b>؛ مدارس، جامعات، جهات حكومية (Harvard).</td></tr>
<tr><td class="ltr">Mascot Logo</td><td>entertainment marketing؛ لـ <b>العيلات والأطفال</b> لأنه بيقرب البراند ويخليه friendly.</td></tr>
</table></div>
<div class="tip">الأسئلة بتجيب الوصف وتسألك النوع: "long names" = Letter Mark، "no text" = Logo Symbol، "no known image" = Abstract، "universities" = Emblem، "children" = Mascot.</div>
</section>

<section class="sec px"><h2>6. The Idea of the Logo</h2>
<div class="cards">
<div class="card"><span class="k">Direct · service</span><p>بيوري حاجة مرتبطة بالخدمة (فنجان قهوة لكافيه).</p></div>
<div class="card"><span class="k">Direct · name</span><p>بيوري حاجة مرتبطة باسم البراند (تفاحة Apple).</p></div>
<div class="card"><span class="k">Indirect idea</span><p>بيوصل فكرة معينة بشكل غير مباشر (FedEx, Amazon).</p></div>
</div>
</section>

<section class="sec px"><h2>7. Egyptian Museum Logos</h2>
<p>لوجو المتحف بيعكس الـ cultural & civilizational identity: طبيعة الـ collection، رسالة المتحف، أو شكل المبنى نفسه.</p>
<div class="tbl"><table>
<tr><th>Museum</th><th>Simplicity</th><th>Shape & color</th></tr>
<tr><td class="ltr">Grand Egyptian Museum (GEM)</td><td><b>Very high</b>: شكل بسيط بلون واحد، سهل يتصغر ويتطبع ويتحرك.</td><td>abstract geometric مستوحى من <b>المسقط الأفقي للمبنى</b> (top view)، <b>برتقالي دافي</b> زي الشمس على هضبة الجيزة. أقوى international brand.</td></tr>
<tr><td class="ltr">NMEC (Civilization)</td><td><b>Medium–high</b>: واضح لكن الـ <b>gold gradient</b> بيصعب الطباعة بلون واحد.</td><td><b>Wordmark</b> من غير symbol، navy و gold. الاختصار NMEC سهل كـ hashtag.</td></tr>
<tr><td class="ltr">Egyptian Museum, Tahrir</td><td><b>Low</b>: التفاصيل والظلال بتضيع لما يصغر.</td><td>رسم تفصيلي للواجهة التاريخية بـ embossed effect، أقرب لـ illustration من logo.</td></tr>
<tr><td class="ltr">Museum of Islamic Art, Cairo</td><td><b>Medium</b>: الـ symbol قوي لوحده كـ icon.</td><td><b>نجمة سداسية</b> بحلقات متداخلة من مبادئ الزخرفة الإسلامية.</td></tr>
</table></div>
</section>

<section class="sec px"><h2>8. Stages of Logo Design</h2>
<div class="pipe">
<div class="st"><small>01</small><b>Mood Board</b>collage صور ولوجوهات وألوان وخامات (visual feeding).</div>
<div class="st"><small>02</small><b>Several designs</b>ارسم أكتر من فكرة وقارن، متقفش على أول فكرة.</div>
<div class="st"><small>03</small><b>Fonts</b>عربي وإنجليزي متناسقين (Google Fonts).</div>
<div class="st"><small>04</small><b>Color palette</b>tool يطلع ألوان من صورة، أو Color Hunt.</div>
</div>
</section>

<section class="sec px"><h2>9. In Illustrator: Building the Logo</h2>
<div class="tbl"><table>
<tr><th>Tool</th><th>Use</th></tr>
<tr><td class="ltr">Pen Tool <kbd>P</kbd></td><td>paths دقيقة بالـ anchor points. <b>Click & drag</b> يعمل curve، <b>Shift</b> يقفل على 45°، والضغط على أول نقطة بيقفل الشكل.</td></tr>
<tr><td class="ltr">Curvature Tool <kbd>Shift + ~</kbd></td><td>curves ناعمة بكليكات بسيطة؛ <b>double-click</b> يقلب النقطة smooth/corner.</td></tr>
<tr><td class="ltr">Direct Selection <kbd>A</kbd></td><td>تعديل الـ anchor points والـ handles (الـ <kbd>V</kbd> بيحرك الشكل كله).</td></tr>
<tr><td class="ltr">Anchor Point Tool <kbd>Shift + C</kbd></td><td>تحويل smooth ↔ corner.</td></tr>
<tr><td class="ltr">Pathfinder</td><td><b>Window &gt; Pathfinder</b>: <b>Unite</b> يدمج، <b>Minus Front</b> يقص الأمامي من الخلفي، <b>Intersect</b> يسيب المنطقة المشتركة.</td></tr>
<tr><td class="ltr">Shape Builder <kbd>Shift + M</kbd></td><td>اسحب على المناطق تدمجها، و <b>Alt/Option + click</b> تمسح منطقة.</td></tr>
<tr><td class="ltr">Create Outlines <kbd>Shift + Ctrl/Cmd + O</kbd></td><td>النص يبقى vector shapes ومش معتمد على font متسطب.</td></tr>
<tr><td class="ltr">Outline Stroke</td><td><b>Object &gt; Path &gt; Outline Stroke</b>: الـ strokes تبقى filled shapes قبل الـ Pathfinder.</td></tr>
</table></div>
<ul class="l"><li>اختبره على مستطيل أبيض ومستطيل أسود.</li><li>احفظه <b>vector</b> (AI, SVG, PDF) عشان يتكبر من غير ما يبوظ، وطلّع PNG/JPEG لما تحتاج.</li></ul>
</section>`},

"5":{title:"Designing Website Elements",ar:"تصميم عناصر الموقع",sub:"Menus · Buttons · Icons · Cards · Typography · Graphics · Visual Consistency · Museum Colors",
hello:"آخر محاضرة: كل عنصر وقواعده. وفي الآخر ألوان المتاحف وعلم نفس الألوان.",
html:`
<section class="sec px"><h2>1. Elements of the Interface</h2>
<p>الـ focus على الـ visual structure والـ layout <b>قبل الألوان</b>، وبعدين تصميم كل عنصر لوحده.</p>
<div class="tbl"><table>
<tr><th>Elements</th><th>Role</th></tr>
<tr><td class="ltr">Logo · Navigation Menu</td><td>نقطة التعرف وطريقة التنقل في الموقع.</td></tr>
<tr><td class="ltr">Buttons · Icons</td><td>clear signals of action and function.</td></tr>
<tr><td class="ltr">Cards · Headings & Typography</td><td>تنظيم المحتوى وتحديد إيه يتقري الأول.</td></tr>
<tr><td class="ltr">Illustrations & Graphic Elements</td><td>دعم الفكرة والـ visual presence.</td></tr>
</table></div>
</section>

<section class="sec px"><h2>2. Navigation Menus & Buttons</h2>
<div class="two">
<div class="card"><span class="k">Navigation menus</span><p>بتنظم الـ links وتسهل الوصول لأقسام الموقع.</p></div>
<div class="card"><span class="k">Buttons</span><p>بتوجه اليوزر يعمل <b>action محدد</b>.</p></div>
</div>
<ul class="l"><li>${T("Distinguish the primary element from the secondary elements")} عشان اليوزر يعرف الـ main action.</li><li>خلي بالك من الـ alignment والـ spacing والـ visual clarity.</li></ul>
<p>أمثلة الـ nav bars: من صف links بسيط لحد bars فيها ${T("search field")} و ${T("call-to-action button")}.</p>
</section>

<section class="sec px"><h2>3. Icon Design</h2>
<ul class="l">
<li>${T("Express functions using simple symbols")}.</li>
<li>${T("Unify the drawing style and the thickness of the lines")}.</li>
<li>اهتم بالـ proportion والـ alignment.</li>
<li>الأيقونة لازم تفضل واضحة <b>لما حجمها يصغر</b>.</li>
</ul>
<p>الـ icon set المتناسق: ${T("same line weight, style and proportions")} (profile, home, favorite, mail, search, settings, location).</p>
</section>

<section class="sec px"><h2>4. Card Design</h2>
<p>الـ cards بتعرض ${T("independent pieces of content")} زي كورس تعليمي، أو artifact، أو معرض فني. الكارت فيه:</p>
<div class="cards">
<div class="card"><span class="k">Image</span><p>صورة أو عنصر مرئي.</p></div>
<div class="card"><span class="k">Title + description</span><p>عنوان ووصف قصير.</p></div>
<div class="card"><span class="k">Button / link</span><p>عشان يعرف أكتر.</p></div>
<div class="card"><span class="k">Unified size & padding</span><p>أبعاد ومسافات داخلية موحدة.</p></div>
</div>
</section>

<section class="sec px"><h2>5. Headings & Typography</h2>
<ul class="l"><li>فرّق بين ${T("main heading")} و ${T("subheading")} و ${T("body text")}.</li><li>اختار sizes و weights مناسبة.</li><li>اظبط المسافة بين الحروف (letter spacing) وبين السطور (line spacing).</li><li>الهدف: ${T("readability")} و ${T("clear visual hierarchy")}.</li></ul>
<div class="tscale">
<div><small>H1 · 36px</small><span style="font-size:36px;font-weight:700">Main heading</span></div>
<div><small>H2 · 28px</small><span style="font-size:28px;font-weight:600">Subheading</span></div>
<div><small>Body · 16px</small><span style="font-size:16px">The main text of the page.</span></div>
<div><small>Caption · 12px</small><span style="font-size:12px">Small supporting text</span></div>
</div>
<div class="tip">الـ font size بيعمل <b>visual priority and reading order</b>. احفظ: H1 36، H2 28، Body 16، Caption 12.</div>
</section>

<section class="sec px"><h2>6. Illustrations & Graphic Elements</h2>
<p>بتدي الـ interface ${T("personality")}:</p>
<ul class="l"><li>${T("geometric shapes and ornaments")}.</li><li>${T("repeating patterns")} و ${T("explanatory illustrations")}.</li><li>الألوان ${T("support the identity")} بتاعة الموقع.</li><li>${T("balance between graphics and content")}: الجرافيك ميغطيش على المحتوى.</li></ul>
</section>

<section class="sec px"><h2>7. Design Principles & Visual Consistency</h2>
<div class="tbl"><table>
<tr><th>Principle</th><th>What it means</th></tr>
<tr><td class="ltr">Alignment and balance</td><td>العناصر بتشارك edges، والوزن موزع بالتساوي.</td></tr>
<tr><td class="ltr">Contrast and hierarchy</td><td>فرق الـ size واللون والـ weight يوضح الأهم.</td></tr>
<tr><td class="ltr">Unity and consistency</td><td>كل عنصر شكله من نفس الموقع.</td></tr>

const DOCQ={"2": [{"q": "What is the main purpose of a Web Layout?", "o": ["To add animations to a website", "To organize and distribute elements within a web page", "To write HTML and CSS code", "To edit photographs"], "a": 1, "e": "A Web Layout determines how the elements of a webpage are organized, positioned, sized, and aligned to create a clear and functional structure."}, {"q": "Which of the following is commonly considered a major section of a webpage?", "o": ["Header", "Navigation", "Main Content", "All of the above"], "a": 3, "e": "A typical webpage may contain a Header, Navigation, Main Content, Hero Section, Sidebar, and Footer. Not every website must contain all of them."}, {"q": "What is the primary function of a Header?", "o": ["To display only photographs", "To provide the main visual and identification area of a website", "To replace the Footer", "To create animations"], "a": 1, "e": "The Header usually contains important elements such as the logo, brand name, navigation, search, or user-related actions."}, {"q": "What is the main purpose of Navigation in a website?", "o": ["To edit images", "To help users move between different pages or sections", "To change image resolution", "To create color palettes"], "a": 1, "e": "Navigation provides users with clear pathways to move through the website and access its different sections."}, {"q": "What is a Hero Section?", "o": ["A hidden section at the bottom of the page", "A prominent area usually located near the beginning of a webpage", "A section used only for coding", "A type of website footer"], "a": 1, "e": "The Hero Section is usually one of the most visually prominent areas of a webpage. It may contain an image, headline, description, and Call to Action."}, {"q": "What is the purpose of a Grid System in web design?", "o": ["To randomly position elements", "To organize elements and maintain alignment and consistency", "To add animations", "To compress images"], "a": 1, "e": "A Grid System provides a structured framework that helps designers organize content, maintain alignment, and create consistent spacing."}, {"q": "Which of the following are common components of a Grid System?", "o": ["Columns, Rows, and Gutters", "Brushes, Effects, and Filters", "Layers, Masks, and Channels", "Frames, Audio, and Video"], "a": 0, "e": "Columns, rows, gutters, and margins are fundamental components used to organize content within a layout."}, {"q": "What does a 12-column grid provide?", "o": ["Exactly 12 elements on every webpage", "A flexible structure for dividing the page into different proportions", "Twelve different colors", "Twelve mandatory sections"], "a": 1, "e": "A 12-column grid allows designers to create different combinations, such as 6+6, 4+8, or 3+6+3, while maintaining consistent alignment."}, {"q": "Which combination represents a valid 12-column grid division?", "o": ["4 + 4 + 4", "5 + 5 + 5", "7 + 7", "8 + 8"], "a": 0, "e": "4 + 4 + 4 equals 12 columns. This allows the designer to create three equal content areas."}, {"q": "What is a gutter?", "o": ["The space between columns in a grid", "The space inside a button", "The main webpage title", "The website footer"], "a": 0, "e": "A gutter is the space separating columns or grid areas. It prevents content from appearing crowded."}, {"q": "What is the difference between a margin and a gutter?", "o": ["A margin is between columns, while a gutter is outside the page", "A margin is the space around the content area, while a gutter separates columns", "They are exactly the same", "Neither is related to layout"], "a": 1, "e": "Margins define the space between the content and the edges of the layout, while gutters create separation between columns."}, {"q": "What is Visual Hierarchy?", "o": ["The random arrangement of visual elements", "The organization of elements according to their visual importance", "The process of exporting images", "The use of only large images"], "a": 1, "e": "Visual Hierarchy guides the viewer's attention by controlling factors such as size, position, contrast, spacing, typography, and imagery."}, {"q": "Which factor can be used to make an element more visually prominent?", "o": ["Size", "Contrast", "Position", "All of the above"], "a": 3, "e": "Size, contrast, position, spacing, typography, and imagery can all contribute to the visual hierarchy of a webpage."}, {"q": "What is the first step when creating a webpage layout in Adobe Illustrator?", "o": ["Add final photographs", "Create and set up the Artboard", "Add animations", "Export the website"], "a": 1, "e": "The Artboard provides the working area in which the webpage structure will be created. Its size should be determined according to the intended screen or design format."}, {"q": "Why is a Grid created in Adobe Illustrator when designing a webpage?", "o": ["To create random shapes", "To help organize and align webpage elements", "To automatically create HTML code", "To apply photographic effects"], "a": 1, "e": "The Grid acts as a visual framework that helps the designer position elements consistently and maintain alignment throughout the layout."}, {"q": "Which Illustrator feature can help create a structured grid for a webpage?", "o": ["Rectangular Grid Tool", "Eraser Tool", "Paintbrush Tool", "Blur Tool"], "a": 0, "e": "The Rectangular Grid Tool can be used to create a grid consisting of rows and columns, which can serve as a guide for building a web layout."}, {"q": "After creating the Artboard and Grid, what should the designer generally do next?", "o": ["Randomly add colors", "Establish the main structural sections of the webpage", "Export the file", "Add photographic filters"], "a": 1, "e": "The designer should first establish the main structure, such as Header, Navigation, Hero Section, Content Areas, and Footer, before focusing on detailed visual styling."}, {"q": "Which Illustrator elements can be used to construct the basic structure of a webpage?", "o": ["Rectangles and simple shapes", "Guides and grids", "Text objects", "All of the above"], "a": 3, "e": "Simple shapes, guides, grids, and text objects can all be used to construct a clear structural layout before applying the final visual design."}, {"q": "Why should Guides be used when creating a Visual Layout in Illustrator?", "o": ["To add animation", "To help maintain alignment and consistent positioning", "To improve image resolution", "To create website code"], "a": 1, "e": "Guides provide visual references that help the designer align elements and maintain consistent spacing throughout the page."}, {"q": "Which sequence is most appropriate for creating a basic Visual Layout in Illustrator?", "o": ["Colors → Photos → Export → Grid", "Artboard → Grid → Sections → Alignment → Spacing", "Export → Photos → Artboard → Grid", "Animation → Prototype → Grid → Artboard"], "a": 1, "e": "The structural workflow begins with setting up the Artboard, establishing the Grid, defining the main sections, aligning the elements, and controlling the spacing."}, {"q": "Why is it useful to create the structural layout before adding final colors and images?", "o": ["It makes the design easier to organize and revise", "It prevents the use of Illustrator", "It eliminates the need for typography", "It automatically creates the final website"], "a": 0, "e": "Building the structure first allows the designer to focus on composition, hierarchy, alignment, and spacing before becoming distracted by decorative details."}, {"q": "Which of the following is an appropriate way to represent a webpage section during the structural layout stage?", "o": ["Using simple rectangles to represent content areas", "Using random photographs", "Using animation effects", "Using final video files"], "a": 0, "e": "Simple shapes, especially rectangles, can represent areas such as images, cards, text blocks, and sections while the overall structure is being developed."}, {"q": "A designer creates a Homepage in Illustrator using an Artboard, Grid, Guides, rectangles, and text placeholders, but does not apply final colors or photographs. What has the designer created?", "o": ["A finished website", "A structural/visual layout", "A video prototype", "A coded webpage"], "a": 1, "e": "At this stage, the designer has established the visual and structural organization of the page without completing the final visual styling."}, {"q": "Why should Layers be organized when creating a webpage layout in Illustrator?", "o": ["To make the file easier to edit and manage", "To automatically publish the website", "To increase internet speed", "To create HTML code"], "a": 0, "e": "Organized layers make it easier to select, modify, hide, and manage different sections and elements of the webpage."}, {"q": "Which approach is most appropriate when designing the structural layout of a website in Illustrator?", "o": ["Place every element randomly and adjust it later", "Start with the page structure, establish the grid, then organize and align the elements", "Start with decorative effects", "Start by exporting the page"], "a": 1, "e": "A structured workflow produces a more consistent and professional layout and makes later stages, such as coloring and prototyping in Adobe XD, easier."}, {"q": "A student wants to design a portfolio website for an artist. Which layout would be most appropriate for presenting multiple artworks?", "o": ["A card-based or grid layout", "A text-only layout", "A footer-only layout", "A navigation-only layout"], "a": 0, "e": "A card-based or grid layout allows multiple artworks to be organized clearly while giving each artwork its own visual area."}, {"q": "A student places the logo, navigation, hero image, and content sections without using a grid or alignment guides. The page looks visually unbalanced. What is the most appropriate solution?", "o": ["Add more colors", "Add more images", "Establish a Grid and use Guides for alignment", "Remove the Header"], "a": 2, "e": "The problem is structural rather than decorative. A grid and guides can help establish consistent alignment, spacing, and proportions."}, {"q": "Which workflow best matches the course workflow discussed in the lecture?", "o": ["Photoshop → Coding → Illustrator → XD", "Illustrator structural layout → XD Wireframe/Prototype → Photoshop image preparation → Illustrator visual design → XD final interactive prototype", "XD → Photoshop → Coding → Illustrator", "Photoshop → Illustrator → Final Website without XD"], "a": 1, "e": "The course workflow gradually develops the project from structure to wireframing and interaction, then prepares visual assets and finishes the final interactive prototype in XD."}, {"q": "Why is Adobe Illustrator particularly useful for creating the structural layout of a website?", "o": ["It provides precise vector-based shapes, alignment, grids, guides, and scalable artwork", "It automatically hosts websites", "It replaces HTML and CSS", "It is designed only for photo editing"], "a": 0, "e": "Illustrator is well suited for creating precise vector-based layouts and interface elements because it provides tools for grids, guides, alignment, shapes, typography, and scalable graphics."}, {"q": "What is the main goal of the Illustrator stage before moving to Adobe XD?", "o": ["To create the website's final code", "To establish a clear and organized visual structure that can later be developed into an interactive prototype", "To edit all photographs professionally", "To publish the website online"], "a": 1, "e": "The Illustrator stage establishes the visual structure and design foundation. Adobe XD is then used to organize the screens and add navigation and interactions."}], "3": [{"q": "Which layer of website design unifies the colors, fonts and elements across the pages?", "o": ["Visual structure", "Visual design", "Visual identity", "Visual hierarchy"], "a": 2, "e": "Visual identity unifies colors, fonts and elements. Visual structure sets the places of elements; visual design gives the logo, icons and buttons their shape and function."}, {"q": "Which layer determines the places of the elements on a page?", "o": ["Visual structure", "Visual identity", "Visual design", "Typography"], "a": 0, "e": "Visual structure determines where elements are placed."}, {"q": "What is the role of Buttons and Icons in a website interface?", "o": ["Organize content and decide what is read first", "Clear signals of action and function", "Support the idea with visual presence", "Point of recognition for the brand"], "a": 1, "e": "Buttons and icons are clear signals of action and function."}, {"q": "Which elements 'organize the content and decide what is read first'?", "o": ["Logo and Navigation Menu", "Buttons and Icons", "Cards, Headings and Typography", "Illustrations and Graphic Elements"], "a": 2, "e": "Cards, headings and typography organize content and set reading order."}, {"q": "What is the working rule for designing website elements?", "o": ["Each element should be as eye-catching as possible", "Elements must belong to one system, not only look good alone", "Use a different style for each page", "Avoid repeating any element"], "a": 1, "e": "It is not enough for each element to be beautiful on its own; the elements must belong to one system."}, {"q": "Which principle says 'size and color decide what is seen first'?", "o": ["Unity and coherence", "Alignment and consistency", "White space", "Contrast and visual hierarchy"], "a": 3, "e": "Contrast and visual hierarchy control what the eye sees first."}, {"q": "What does white space do, according to the lecture?", "o": ["Wastes screen area", "Clarifies the relationship between elements", "Replaces the grid", "Makes text justified"], "a": 1, "e": "Empty space clarifies the relationship between elements."}, {"q": "Which principle means 'shared edges make the interface readable'?", "o": ["Alignment and consistency", "Unity and coherence", "Contrast", "White space"], "a": 0, "e": "Shared edges come from alignment and consistency."}, {"q": "In the 12-column grid, what do the gutter and the margin control?", "o": ["The number of columns", "The color palette", "The font size", "Distances between areas of the page and its edges"], "a": 3, "e": "Columns set widths of cards, images and content areas; gutter and margin control the distances between areas and the page edges."}, {"q": "Which 12-column division suits 'three equal cards'?", "o": ["6 + 6", "4 + 4 + 4", "3 + 6 + 3", "4 + 8"], "a": 1, "e": "4 + 4 + 4 gives three equal cards. 3 + 6 + 3 is content in the middle with side margins."}, {"q": "Which division gives a supporting area beside the main content?", "o": ["4 + 4 + 4", "6 + 6", "4 + 8", "3 + 6 + 3"], "a": 2, "e": "4 + 8 puts a supporting area beside the main content."}, {"q": "What is the gutter?", "o": ["The space around the content area", "The inner space around an element's content", "The space between the columns", "The maximum width of the page"], "a": 2, "e": "Margin is around the content area, gutter is between columns, padding is inside an element."}, {"q": "What is padding?", "o": ["The inner space around the content of an element", "The space between columns", "The space around the content area", "The width of the container"], "a": 0, "e": "Padding is the inner space around an element's content."}, {"q": "Which set of values belongs to the 8px spacing system?", "o": ["5, 10, 15, 20", "8, 16, 24, 32, 48, 64", "10, 20, 30, 40", "8, 12, 18, 24"], "a": 1, "e": "The scale is multiples of eight: 8, 16, 24, 32, 48 and 64 px. A fixed scale keeps spacing consistent."}, {"q": "What are the indicative desktop values for gutter and margin?", "o": ["Gutter 16px, margin 20px", "Gutter 32px, margin 24px", "Gutter 24px, margin 32px", "Gutter 20px, margin 16px"], "a": 2, "e": "Desktop: gutter 24px, margin 32px. Mobile: gutter 16px, margin 20px."}, {"q": "Which container width is suggested for reading?", "o": ["1140px", "1280px", "1440px", "375px"], "a": 0, "e": "1140px for reading, 12
