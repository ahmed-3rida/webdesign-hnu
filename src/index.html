ler artboard than Web-Large."}, {"q": "Which unit is used when creating a web page artboard?", "o": ["Pixels (px)", "Millimeters", "Inches", "Points only"], "a": 0, "e": "Web layouts are measured in pixels. Print uses mm, inches or points."}, {"q": "Which color mode should the new web document use?", "o": ["CMYK", "RGB", "Grayscale only", "Lab"], "a": 1, "e": "Web designs are for screens, so RGB. (The Web presets already use RGB.)"}, {"q": "Which Raster Effects resolution is set for screen design?", "o": ["72 ppi", "300 ppi", "600 ppi", "1200 ppi"], "a": 0, "e": "Screen (72 ppi) is used for web. 300 ppi (High) is for print."}, {"q": "How many artboards does a single-page web layout need to start with?", "o": ["One artboard for each screen size you design (for example desktop and smaller laptop)", "Always 10", "None", "Only one for every project"], "a": 0, "e": "You can create one artboard per screen size, or separate files, to design each version."}, {"q": "What is the shortcut to show or hide rulers?", "o": ["Ctrl/Cmd + R", "Ctrl/Cmd + G", "Ctrl/Cmd + U", "Ctrl/Cmd + Y"], "a": 0, "e": "Ctrl/Cmd + R toggles rulers (View > Rulers > Show Rulers). Guides are pulled out of them."}, {"q": "How do you create a guide from a ruler?", "o": ["Click and drag from the top or left ruler onto the artboard", "Press Delete", "Use the Eraser Tool", "Save the file as PDF"], "a": 0, "e": "Drag from the horizontal ruler for horizontal guides and from the vertical ruler for vertical guides."}, {"q": "How do you turn a drawn rectangle into a guide?", "o": ["Select it, then View > Guides > Make Guides", "Press Ctrl/Cmd + S", "Group it", "Change its color to gray"], "a": 0, "e": "View > Guides > Make Guides converts a selected object into a guide. Release Guides turns it back into an object."}, {"q": "Which tool creates evenly spaced columns with gutters in one step?", "o": ["Object > Path > Split Into Grid", "Edit > Copy", "File > Export", "Object > Expand"], "a": 0, "e": "Draw a rectangle for the content area, choose Split Into Grid, set the columns and gutter, then make guides from them."}, {"q": "In Split Into Grid, what does the Gutter value set?", "o": ["The space between columns", "The artboard width", "The page margin", "The stroke weight"], "a": 0, "e": "Gutter is the space between columns (or rows). Margin is the space between the content area and the page edge."}, {"q": "A 12-column grid has how many gutters between the columns?", "o": ["11", "12", "13", "10"], "a": 0, "e": "Gutters sit between columns, so 12 columns have 11 gutters."}, {"q": "According to the lecture, which gutter and margin are indicative for desktop?", "o": ["Gutter 24px, margin 32px", "Gutter 16px, margin 20px", "Gutter 8px, margin 8px", "Gutter 64px, margin 64px"], "a": 0, "e": "Desktop: gutter 24px, margin 32px. Mobile: gutter 16px, margin 20px."}, {"q": "Which command shows the document grid in Illustrator?", "o": ["View > Show Grid (Ctrl/Cmd + ')", "File > Show Grid", "Edit > Grid", "Window > Grid"], "a": 0, "e": "View > Show Grid displays the grid; Snap to Grid makes objects stick to it."}, {"q": "Where do you change the grid spacing (Gridline every, Subdivisions)?", "o": ["Preferences > Guides & Grid", "File > Document Setup", "Window > Layers", "Object > Transform"], "a": 0, "e": "Preferences > Guides & Grid, for example 8px with subdivisions to follow the 8px system."}, {"q": "What does Smart Guides (Ctrl/Cmd + U) help with?", "o": ["Aligning objects to others and the artboard while you move them", "Saving the file", "Changing color mode", "Exporting JPEG"], "a": 0, "e": "Smart Guides show alignment lines and measurements as you move objects."}, {"q": "Why lock guides after creating them?", "o": ["So you do not move them by accident while drawing", "So the file becomes a PDF", "So colors change", "So the artboard is deleted"], "a": 0, "e": "View > Guides > Lock Guides prevents accidental moves."}, {"q": "Why is a web layout often first drawn in shades of gray?", "o": ["To focus on structure, spacing and hierarchy before colors and images", "Because Illustrator cannot use color", "To reduce the artboard size", "Because gray is required by JPEG"], "a": 0, "e": "A grayscale wireframe separates structure from visual identity. Color is added later."}, {"q": "Which basic shape would you use for the header, hero and footer blocks?", "o": ["Rectangle Tool", "Star Tool", "Polygon Tool", "Spiral Tool"], "a": 0, "e": "Rectangles for the main blocks such as header, hero, cards and footer."}, {"q": "Which shape suits a button in a wireframe?", "o": ["Rounded Rectangle", "Star", "Spiral", "Line only"], "a": 0, "e": "A rounded rectangle with a darker gray fill reads as a button."}, {"q": "Which basic shape is usually used for a profile picture or avatar?", "o": ["Ellipse (circle with Shift)", "Rectangle", "Triangle", "Star"], "a": 0, "e": "A circle (Ellipse Tool + Shift) is the standard avatar shape."}, {"q": "How do you make a gray fill from the Color panel?", "o": ["Set the mode to Grayscale and move the K slider, or pick a gray swatch", "Choose CMYK blue", "Use the Zoom Tool", "Choose the Eraser"], "a": 0, "e": "Use gray swatches or the Grayscale slider. Light grays for backgrounds, mid-grays for image placeholders, dark grays for text and buttons."}, {"q": "In a grayscale wireframe, how is visual hierarchy shown?", "o": ["By differences in size and tone (lighter vs darker gray)", "By using many colors", "By making all blocks the same", "By deleting the borders"], "a": 0, "e": "Size and tone create contrast: darker and larger elements draw the eye first."}, {"q": "How do you mark an image placeholder in a wireframe?", "o": ["A gray rectangle, optionally with two crossing lines", "A random star", "A red circle", "Leave the page empty"], "a": 0, "e": "A gray rectangle (with a cross) is the usual placeholder for images."}, {"q": "Which panel helps keep header, hero, content and footer organized as separate sections?", "o": ["Layers panel", "Swatches panel", "Brushes panel", "Symbols panel"], "a": 0, "e": "Create named layers (Header, Hero, Content, Footer) and lock the ones you finished."}, {"q": "Which panel evenly aligns and distributes the cards?", "o": ["Align panel", "Pathfinder panel", "Appearance panel", "Image Trace panel"], "a": 0, "e": "The Align panel aligns to the artboard or a key object and distributes spacing evenly."}, {"q": "How should the spacing between blocks be chosen?", "o": ["From the 8px scale (8, 16, 24, 32, 48, 64)", "Randomly", "Always 1px", "Only by eye with no values"], "a": 0, "e": "Use the fixed 8px scale to keep spacing consistent."}, {"q": "Which is the best order when building the wireframe?", "o": ["Place guides and grid first, then draw the large blocks, then details", "Draw colors first, then grid", "Export first, then draw", "Add text before any structure"], "a": 0, "e": "Layout before elements: grid and guides, big shapes (header, hero, sections), then cards, buttons and text."}], "4": [{"q": "What is a logo?", "o": ["A photo of the building", "A long paragraph describing a company", "A symbol that expresses a product, company or service and delivers its message clearly to the target audience", "A page layout grid"], "a": 2, "e": "A logo is a symbol expressing a product, company or service, and it must deliver its message clearly."}, {"q": "Which of these is NOT one of the four points of the logo design strategy?", "o": ["Research the competitors", "Choose gradients and shadows", "Think long term", "Understand the business"], "a": 1, "e": "The four points: understand the business, research competitors, know the target audience, think long term."}, {"q": "Why does the designer research the competitors' logos?", "o": ["To copy them exactly", "To find out about their visual identity", "To skip the sketching stage", "To avoid using any colors"], "a": 1, "e": "Researching competitors shows their visual identity, so the new logo can be distinct."}, {"q": "Why should a logo be designed with the long term in mind?", "o": ["It is only used on social media", "It only appears once", "It must last for many years despite continuous change and development", "It will be replaced every month"], "a": 2, "e": "A logo should survive many years of change and development."}, {"q": "The evolution of logos has always moved toward...", "o": ["More gradients", "Simplicity and the ability to adapt", "More details and decoration", "Longer text"], "a": 1, "e": "Brands simplify logos so they stay in consumers' minds long term and adapt to different uses."}, {"q": "In which years did the Concord Museum logo change in the lecture?", "o": ["2004 and 2023 only", "1950 only", "1990, 2003 and 2023", "1980, 1999 and 2010"], "a": 2, "e": "Concord Museum: 1990 (detailed seal-like emblem), 2003 and 2023 (simple typographic marks)."}, {"q": "How many main versions did the Natural History Museum (London) logo have?", "o": ["One", "Two: 1990 and 2023", "Five", "Three: before 2004, 2004-2023 and 2023-present"], "a": 3, "e": "Before 2004, from 2004 to 2023, and from 2023 to the present."}, {"q": "What does the criterion 'Simplicity' say about a logo?", "o": ["It should have a long paragraph", "It should contain only one distinctive symbol", "It should be full of details", "It should contain many symbols"], "a": 1, "e": "The public sees a logo for a moment, so it should be simple with one distinctive symbol."}, {"q": "How many typefaces should a logo use?", "o": ["Four different fonts", "A new font per letter", "One typeface, consistent in Arabic and English text", "No text at all"], "a": 2, "e": "One type of font for the text, whether Arabic or English."}, {"q": "What does the lecture recommend about logo color?", "o": ["As many colors as possible", "Always use shadows", "Always use gradients", "One color, or two at most, without gradients or shadows"], "a": 3, "e": "Limited color: preferably one or two, without gradients or shadows."}, {"q": "On which backgrounds must a logo work?", "o": ["Only gradients", "White and black", "Only white", "Only photos"], "a": 1, "e": "A logo must be usable on both white and black backgrounds."}, {"q": "What does 'Versatility' mean in logo criteria?", "o": ["It only works on screens", "It uses many fonts", "It changes color each day", "It suits very large sizes (billboards) and very small sizes (business cards, pins)"], "a": 3, "e": "It can be enlarged or reduced without losing its features."}, {"q": "Why should a designer avoid following trends in logo design?", "o": ["Because trends need gradients", "Because trends are expensive", "So the logo can be used at any time and in any place", "Because trends are illegal"], "a": 2, "e": "Avoiding trends keeps the logo timeless."}, {"q": "Which logo type 'helps to distinguish the name of the brand'?", "o": ["Emblem", "Abstract Mark", "Word Mark", "Mascot"], "a": 2, "e": "A word mark (logotype) is the brand name styled as the logo, like Google or Coca-Cola."}, {"q": "Which logo type is ideal for brands with long names?", "o": ["Mascot", "Logo Symbol", "Emblem", "Letter Mark"], "a": 3, "e": "A letter mark (like IBM or CNN) makes long names easy to recognize."}, {"q": "Which type is a distinctive logo that needs no accompanying text?", "o": ["Logo Symbol", "Word Mark", "Letter Mark", "Combination Mark"], "a": 0, "e": "A logo symbol (like the Apple or Twitter bird) is recognized without text."}, {"q": "Which logo type stirs feelings without forming a known image?", "o": ["Abstract Mark", "Emblem Logo", "Mascot Logo", "Word Mark"], "a": 0, "e": "Abstract marks (like Pepsi or Nike) use abstract shapes; brands use them to stand out."}, {"q": "Which type combines the word and the shape?", "o": ["Logo Symbol", "Combination Mark", "Letter Mark", "Abstract Mark"], "a": 1, "e": "A combination mark strengthens visual identity and ensures the brand is recognized."}, {"q": "Which type gives a traditional, trustworthy feeling and is often used by universities and government bodies?", "o": ["Word Mark", "Emblem Logo", "Letter Mark", "Mascot Logo"], "a": 1, "e": "Emblem logos, like Harvard's, are common for schools, universities and organizations."}, {"q": "Which type suits brands that target families and children?", "o": ["Letter Mark", "Emblem Logo", "Abstract Mark", "Mascot Logo"], "a": 3, "e": "A mascot makes the brand closer and friendlier, and is used in entertainment marketing."}, {"q": "Which three groups are logos divided into?", "o": ["Word-based, shape-based and word-and-shape combined", "Big, medium and small", "Black, white and gray", "Print, web and video"], "a": 0, "e": "Word-based, shape-based (symbolic) and compound (word and shape)."}, {"q": "A logo idea related to the brand name (like the Apple logo for Apple) is called...", "o": ["Indirect idea", "Direct idea related to the name", "Abstract mark", "Direct idea related to the service"], "a": 1, "e": "The logo shows something connected to the name of the brand."}, {"q": "A coffee-bean cup in a coffee shop logo is...", "o": ["An emblem", "An indirect idea", "A word mark", "A direct idea related to the service"], "a": 3, "e": "It shows something connected to the service that is provided."}, {"q": "FedEx and Amazon are examples of...", "o": ["Mascot logos", "Indirect ideas", "Emblem logos", "Direct ideas related to the service"], "a": 1, "e": "They deliver a specific idea to the audience, but in an indirect way."}, {"q": "Which museum logo is described as a simple single-color shape inspired by the horizontal plan of the building?", "o": ["Museum of Islamic Art", "Grand Egyptian Museum (GEM)", "The Egyptian Museum in Tahrir", "National Museum of Egyptian Civilization"], "a": 1, "e": "GEM has very high simplicity: an abstract geometric shape in warm orange."}, {"q": "Which museum logo is a wordmark with no visual symbol?", "o": ["The Egyptian Museum in Tahrir", "GEM", "Museum of Islamic Art", "National Museum of Egyptian Civilization (NMEC)"], "a": 3, "e": "NMEC is text-based; its gold gradient makes one-color printing difficult."}, {"q": "Why is the Egyptian Museum (Tahrir) logo rated low in simplicity?", "o": ["Fine details and shadows are lost when it is reduced", "It has only one color and no details", "It is only text", "It has no building"], "a": 0, "e": "Its detailed facade drawing and embossed effect are closer to an illustration than a logo."}, {"q": "Which logo uses a six-pointed geometric star with interlocking rings?", "o": ["Museum of Islamic Art in Cairo", "GEM", "NMEC", "The Egyptian Museum in Tahrir"], "a": 0, "e": "The geometric interlacing and star come from Islamic ornament principles."}, {"q": "What is the first stage of logo design?", "o": ["Choose the fonts", "Choose the color palette", "Print the logo", "Make a mood board"], "a": 3, "e": "Stages: 1 mood board, 2 draw several designs, 3 choose fonts, 4 choose color palette."}, {"q": "What is a mood board?", "o": ["A final exported file", "A collage of images, logos, colors and textures that sets the visual direction", "A type of font", "A printing machine"], "a": 1, "e": "It collects visual references ('visual feeding') before the design begins."}, {"q": "In Stage 2, what does the designer do?", "o": ["Writes the summary", "Uses the first idea only", "Chooses only colors", "Draws several different designs and compares them"], "a": 3, "e": "Rather than settling on the first idea, sketch several and compare."}, {"q": "Which websites does the lecture mention for choosing fonts and colors?", "o": ["Google Fonts and Color Hunt", "Only a calculator", "Only a printer", "Only a camera"], "a": 0, "e": "Google Fonts for English fonts, a site for Arabic fonts, Color Hunt for palettes, and a tool that picks colors from an image."}, {"q": "Which Illustrator tool is used to draw precise paths by clicking anchor points?", "o": ["Hand Tool", "Eraser Tool", "Pen Tool (P)", "Zoom Tool"], "a": 2, "e": "The Pen Tool (P) creates paths with straight and curved segments."}, {"q": "How do you make a curved segment with the Pen Tool?", "o": ["Only double-click", "Hold Caps Lock", "Click and drag to pull out direction handles", "Press Delete"], "a": 2, "e": "Click and drag when placing an anchor point; handle length and angle set the curve."}, {"q": "How do you close a shape with the Pen Tool?", "o": ["Press Ctrl/Cmd + S", "Press Tab", "Click on the first anchor point", "Click the artboard name"], "a": 2, "e": "Hover over the starting anchor point and click to close the path."}, {"q": "What does holding Shift do while placing Pen Tool points?", "o": ["Deletes the point", "Zooms in", "Constrains the segment to multiples of 45 degrees", "Changes color"], "a": 2, "e": "Shift locks segments to 45-degree angles."}, {"q": "What is the Curvature Tool good for?", "o": ["Drawing smooth curves easily by clicking points", "Changing color mode", "Exporting PDF", "Making text bold"], "a": 0, "e": "The Curvature Tool (Shift + ~) makes smooth curves with simple clicks and is easier for beginners."}, {"q": "How do you turn a smooth point into a corner point with the Curvature Tool?", "o": ["Press Escape", "Press Delete", "Change the stroke weight", "Double-click the point"], "a": 3, "e": "Double-clicking toggles between smooth and corner points."}, {"q": "Which tool selects and moves individual anchor points and handles?", "o": ["Direct Selection Tool (A)", "Selection Tool (V)", "Zoom Tool", "Artboard Tool"], "a": 0, "e": "The white arrow (A) edits anchor points and handles; the black arrow (V) moves the whole object."}, {"q": "Which tool converts a smooth point into a corner point and vice versa?", "o": ["Anchor Point Tool (Shift + C)", "Rotate Tool", "Gradient Tool", "Eraser Tool"], "a": 0, "e": "The Anchor Point (Convert) Tool switches between corner and smooth points."}, {"q": "Which basic shapes are most useful to build a geometric logo quickly?", "o": ["Ellipse, Rectangle, Polygon and Star", "Only Paintbrush", "Only Spiral", "Only Blob Brush"], "a": 0, "e": "Combine circles, squares, triangles and stars, then merge them."}, {"q": "Which Pathfinder command merges overlapping shapes into one shape?", "o": ["Exclude", "Intersect", "Unite", "Minus Front"], "a": 2, "e": "Unite merges selected shapes into a single shape."}, {"q": "Which Pathfinder command cuts the front shape out of the back shape?", "o": ["Merge", "Divide", "Minus Front", "Unite"], "a": 2, "e": "Minus Front subtracts the shapes in front from the shape at the back."}, {"q": "Which Pathfinder command keeps only the overlapping area?", "o": ["Minus Front", "Outline", "Intersect", "Unite"], "a": 2, "e": "Intersect keeps the area where all selected shapes overlap."}, {"q": "Where do you open the Pathfinder panel?", "o": ["Window > Pathfinder", "Edit > Pathfinder", "View > Pathfinder", "File > Pathfinder"], "a": 0, "e": "Window > Pathfinder (Shift + Ctrl/Cmd + F9)."}, {"q": "What is the shortcut of the Shape Builder Tool?", "o": ["Shift + C", "Shift + P", "Shift + S", "Shift + M"], "a": 3, "e": "Select shapes, then drag across regions with Shape Builder (Shift + M) to merge them."}, {"q": "How do you delete a region with the Shape Builder Tool?", "o": ["Hold Alt/Option and click the region", "Press Ctrl + Z", "Double-click the artboard", "Press Tab"], "a": 0, "e": "Alt/Option + click removes the region under the cursor."}, {"q": "Why convert text to outlines (Create Outlines, Shift + Ctrl/Cmd + O) in a logo?", "o": ["So it gets a shadow", "So it becomes vector shapes and does not depend on an installed font", "So it turns gray", "So it turns into a JPEG"], "a": 1, "e": "Outlined text keeps the same look on any computer and can be edited like a shape."}, {"q": "Why use Object > Path > Outline Stroke before using Pathfinder?", "o": ["To convert strokes into filled shapes that scale and merge correctly", "To delete the artboard", "To change document units", "To make the file smaller only"], "a": 0, "e": "Strokes become filled shapes, so scaling and Pathfinder work as expected."}, {"q": "How can you test that a logo works on white and black backgrounds?", "o": ["Place the logo on a white rectangle and on a black rectangle", "Use more colors", "Add a drop shadow", "Convert it to a photo"], "a": 0, "e": "Test it on both backgrounds, as the criteria require."}, {"q": "Which file format keeps a logo scalable without losing quality?", "o": ["A blurry PNG only", "A screenshot", "Low-resolution JPEG only", "Vector (AI, SVG or PDF)"], "a": 3, "e": "Vector formats can be enlarged or reduced without losing features. Export PNG or JPEG copies when needed."}], "5": [{"q": "According to the introduction, what comes before applying colors in this lecture?", "o": ["Printing the design", "The visual structure and the layout of the page", "Exporting the final files", "Choosing the hosting company"], "a": 1, "e": "The lecture focuses on visual structure and layout before colors, then on the individual elements."}, {"q": "Which elements form 'the point of recognition and the way to move around the site'?", "o": ["Logo and Navigation Menu", "Cards, Headings and Typography", "Illustrations and Graphic Elements", "Buttons and Icons"], "a": 0, "e": "Logo and navigation menu: recognition plus movement around the site."}, {"q": "What is the role of Buttons and Icons?", "o": ["Point of recognition", "Clear signals of action and function", "Organize content and decide what is read first", "Support the idea with visual presence"], "a": 1, "e": "Buttons and icons are clear signals of action and function."}, {"q": "Which elements 'organize the content and decide what is read first'?", "o": ["Illustrations only", "Cards, Headings and Typography", "Buttons and Icons", "Logo and Navigation Menu"], "a": 1, "e": "Cards, headings and typography organize the content and the reading order."}, {"q": "What is the role of Illustrations and Graphic Elements?", "o": ["Provide links between pages", "Organize forms", "Support the idea and give the interface its visual presence", "Set the page width"], "a": 2, "e": "They support the idea and give the interface visual presence."}, {"q": "What does a good element combine, according to the lecture?", "o": ["Animation with sound", "Many colors with many fonts", "Visual clarity with ease of use", "Large size with heavy shadows"], "a": 2, "e": "A good element combines visual clarity with ease of use."}, {"q": "What is the purpose of navigation menus?", "o": ["Guide the user to one action only", "Display independent pieces of content", "Create repeating patterns", "Organize the links and make it easy to reach the sections of the website"], "a": 3, "e": "Menus organize links and make sections easy to reach."}, {"q": "What is the purpose of buttons?", "o": ["Replace all headings", "Guide the user to carry out a specific action", "Show only the logo", "Fill the background"], "a": 1, "e": "Buttons guide the user to a specific action."}, {"q": "Which is a design guideline for menus and buttons?", "o": ["Use different alignment for each item", "Make every button look exactly the same and equally strong", "Avoid spacing between elements", "Distinguish the primary element from the secondary elements"], "a": 3, "e": "Distinguish primary from secondary and take care of alignment, spacing and visual clarity."}, {"q": "Why distinguish a primary button from secondary buttons?", "o": ["To make the page slower", "To remove the menu", "So the user can tell the main action from the supporting ones", "To hide the icons"], "a": 2, "e": "Visual difference shows which action is the most important."}, {"q": "The navigation bar examples range from a simple row of links to bars with...", "o": ["Only a logo", "Only a footer", "Only a slideshow", "A search field and a call-to-action button"], "a": 3, "e": "Figure 1 shows bars from a simple link row to bars with a search field and a call-to-action button."}, {"q": "What do icons do?", "o": ["Show long paragraphs", "Hold the page's background", "Express functions through simple symbols", "Replace the whole layout"], "a": 2, "e": "Icons express functions using simple symbols."}, {"q": "Which is an icon design guideline?", "o": ["Use a different line thickness for each icon", "Make each icon a different style", "Unify the drawing style and the thickness of the lines", "Use very detailed drawings"], "a": 2, "e": "One drawing style and one line thickness keep an icon set consistent."}, {"q": "Which icon guideline concerns small sizes?", "o": ["Add shadows to every icon", "Make sure the icon stays clear when its size is reduced", "Use a long text label inside it", "Make the icon only large"], "a": 1, "e": "Icons must remain clear when reduced."}, {"q": "What does a consistent icon set share, as in the lecture figure?", "o": ["Random colors only", "The same line weight, style and proportions", "Different styles and weights", "Different sizes only"], "a": 1, "e": "The figure shows the same line weight, style and proportions across icons."}, {"q": "What are cards used to display?", "o": ["The main navigation bar", "Only the footer text", "The page background", "Independent pieces of content such as a course, an artifact or an art exhibition"], "a": 3, "e": "Cards display independent pieces of content, such as a course, artifact or exhibition."}, {"q": "Which of these does a card contain?", "o": ["Only the site logo", "Only a long article", "An image or visual element", "Only a menu"], "a": 2, "e": "A card contains an image or visual element, title and short description, a button or link, and unified dimensions and padding."}, {"q": "What text does a card normally include?", "o": ["A full chapter", "Only a copyright line", "A title and a short description", "A random paragraph"], "a": 2, "e": "A title and a short description."}, {"q": "What should a card offer so the user can continue?", "o": ["Nothing", "A hidden menu", "A long form", "A button or link to learn more"], "a": 3, "e": "A button or link to learn more."}, {"q": "Why do cards have unified dimensions and internal spacing (padding)?", "o": ["So a group of cards looks consistent and organized", "To make them different sizes", "To remove the images", "To hide the title"], "a": 0, "e": "Unified dimensions and padding keep cards consistent."}, {"q": "What should text design distinguish between?", "o": ["The main heading, the subheading and the body text", "Only colors", "Only icons", "Only photos"], "a": 0, "e": "Text design distinguishes main heading, subheading and body text."}, {"q": "Which is part of the typography guidelines?", "o": ["Remove all spacing", "Use only one size for all text", "Use the smallest font for headings", "Adjust the spacing between the letters and between the lines"], "a": 3, "e": "Control letter spacing and line spacing, choose sizes and weights, and aim for readability and hierarchy."}, {"q": "In the example type scale, what is the size of H1 (the main heading)?", "o": ["28px", "12px", "36px", "16px"], "a": 2, "e": "H1 36px, H2 28px, Body 16px, Caption 12px."}, {"q": "In the example type scale, what is the size of H2 (the subheading)?", "o": ["36px", "12px", "16px", "28px"], "a": 3, "e": "H2 is 28px."}, {"q": "In the example type scale, what is the size of body text?", "o": ["12px", "36px", "28px", "16px"], "a": 3, "e": "Body text is 16px."}, {"q": "In the example type scale, what is Caption (12px) used for?", "o": ["The main heading", "Small supporting text", "The subheading", "The main text"], "a": 1, "e": "Caption is small supporting text."}, {"q": "What does the type scale figure say about font size?", "o": ["Font size is not important", "Font size creates visual priority and reading order", "Font size only matters for icons", "Font size must be identical"], "a": 1, "e": "Larger text is read first, so size sets priority and order."}, {"q": "Which is a guideline for illustrations and graphic elements?", "o": ["Use only random photos", "Use no patterns ever", "Use geometric shapes and ornaments", "Avoid shapes completely"], "a": 2, "e": "Use geometric shapes and ornaments, repeating patterns and explanatory illustrations."}, {"q": "How should colors be used in graphic elements?", "o": ["To support the identity of the website", "Randomly on every page", "Only in the footer", "Never"], "a": 0, "e": "Colors support the identity of the website."}, {"q": "What balance should be kept in illustrations and graphics?", "o": ["No graphics at all", "A balance between the graphics and the content", "Graphics should cover all the text", "Only text with no space"], "a": 1, "e": "Graphics should add personality without overwhelming the content."}, {"q": "Which principle means 'elements share edges and the weight on the page is distributed evenly'?", "o": ["Contrast and hierarchy", "Alignment and balance", "Unity and consistency", "White space"], "a": 1, "e": "Alignment and balance."}, {"q": "Which principle uses differences in size, color and weight to show what is most important?", "o": ["Contrast and hierarchy", "White space", "Unified colors, shapes and spacing", "Alignment and balance"], "a": 0, "e": "Contrast and hierarchy."}, {"q": "Which principle means every element looks like it belongs to the same website?", "o": ["Unity and consistency", "White space", "Contrast and hierarchy", "Alignment and balance"], "a": 0, "e": "Unity and consistency."}, {"q": "What does white space do?", "o": ["Makes text unreadable", "Separates elements and gives the page room to breathe", "Fills the page with decoration", "Removes the images"], "a": 1, "e": "Empty space separates elements and gives the page room to breathe."}, {"q": "Which principle uses the same palette, shape language and spacing rules throughout?", "o": ["Alignment and balance", "Unified colors, shapes and spacing", "Contrast and hierarchy", "White space"], "a": 1, "e": "The same palette, shape language and spacing rules are used throughout."}, {"q": "What does a design system gather in one reference?", "o": ["Only the page content", "Only photos", "The grid, colors, buttons, typography, icons and spacing", "Only the logo"], "a": 2, "e": "Figure 6: a design system gathers grid, colors, buttons, typography, icons and spacing in one reference."}, {"q": "What is the lecture's conclusion about a good element?", "o": ["It should only be decorative", "It combines visual clarity with ease of use and looks like part of the website's identity", "It should have no function", "It should look different from the rest of the site"], "a": 1, "e": "A good element is clear, easy to use and part of the site's identity."}]};

const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const BANK=(()=>{const seen=new Set(),out=[];ORDER.forEach(k=>QS[k].forEach(q=>{const n=norm(q.q);if(!seen.has(n)){seen.add(n);out.push(q)}}));return out})();

/* ============ random helpers ============ */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const NOSHUF=/all of the above|none of the above|both/i;
function prep(q,r){if(!r||q.o.some(o=>NOSHUF.test(o)))return {...q};const p=shuffled(q.o.map((_,i)=>i),r);return {...q,o:p.map(i=>q.o[i]),a:p.indexOf(q.a)}}
const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(){let s="";const c=window.crypto&&crypto.getRandomValues?crypto.getRandomValues(new Uint32Array(6)):Array.from({length:6},()=>Math.random()*4294967296);for(let i=0;i<6;i++)s+=ALPH[c[i]%ALPH.length];return s}
function buildExam(code){const r=rngFrom(hashStr("wd-exam:"+code));let picked=[];
  ORDER.forEach(k=>{picked.push(...shuffled(BANK.filter(q=>q.lec===k),r).slice(0,PER_LEC))});
  picked=shuffled(picked,r).map(q=>prep(q,r));
  return {title:"Final Exam",ar:"الاختبار الشامل",qs:picked,back:"exam",exam:true,code,modes:true}}

let walkRAF=0;
function walker(){cancelAnimationFrame(walkRAF);const cv=document.getElementById("walker"),stg=document.getElementById("stg");if(!cv)return;
  let x=0,dir=1,t=0;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step=()=>{if(!document.body.contains(cv))return;t++;const W=stg.clientWidth-64;x+=dir*1.4;if(x>W||x<0){dir*=-1}
    cv.style.left=x+"px";cv.style.transform=dir<0?"scaleX(-1)":"none";
    const jumpZone=[.30,.62].some(p=>Math.abs(x+32-(stg.clientWidth*p+16))<22);
    cv.style.bottom=jumpZone?"22px":"8px";
    if(t%4===0)drawPose(cv,jumpZone?"cheer":(Math.floor(t/12)%2?"walk1":"walk2"));
    walkRAF=requestAnimationFrame(step)};
  if(reduce){drawPose(cv,"idle");cv.style.left="20px"}else step();
}

    <div class="codebox"><label for="codeIn" class="lab" style="font-family:var(--f-pixel);font-size:9px;color:var(--acc)">CODE</label><input id="codeIn" maxlength="6" placeholder="${last||"ABC123"}" value="" autocomplete="off" spellcheck="false"><button class="btn g" id="load">LOAD</button></div>
    <p id="codeErr" style="color:var(--rose);margin:6px 0 0" hidden></p>
   </section>
  </div>`;
  document.getElementById("go").onclick=()=>startExam(newCode());
  const inp=document.getElementById("codeIn");
  document.getElementById("load").onclick=()=>{const c=inp.value.trim().toUpperCase();const ok=c.length===6&&[...c].every(ch=>ALPH.includes(ch));
    const er=document.getElementById("codeErr");if(!ok){er.hidden=false;er.textContent="الكود 6 حروف وأرقام، زي K7QM2X.";return}startExam(c)};
  inp.onkeydown=e=>{if(e.key==="Enter")document.getElementById("load").click()};
  window.scrollTo(0,0);
  say("الاختبار الشامل: كل مرة امتحان مختلف. ركز وبالتوفيق!","think");
}
function startExam(code){
  store.set("lastCode",code);
  const Z=buildExam(code);
  S={id:"exam",Z,i:0,ans:Array(Z.qs.length).fill(null),mode:"exam",done:false,t0:Date.now()};
  renderQuiz();window.scrollTo(0,0);
  stopTimer();timerI=setInterval(()=>{const el=document.getElementById("tmr");if(!el||S.done)return;el.textContent=fmt(Date.now()-S.t0)},1000);
  say(`امتحانك اتولد بالكود <b>${code}</b>. بالتوفيق!`,"type");
}
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function renderQuiz(){
  const {Z,i,ans,mode}=S;const n=Z.qs.length;
  if(S.done)return renderResult();
  const q=Z.qs[i];const a=ans[i];const answered=a!==null;const reveal=answered&&mode==="practice";
  const done=ans.filter(x=>x!==null).length;
  app.innerHTML=`<section class="page-head"><span class="eyebrow" dir="ltr">${Z.title}${Z.exam?` · LECTURE ${q.lec}`:""}</span><h1 dir="ltr" style="font-size:clamp(16px,3vw,22px)">${Z.ar}</h1>
  ${Z.exam?`<div class="cta" dir="ltr"><span class="excode">CODE ${Z.code}</span><span class="timer" id="tmr">${fmt(Date.now()-S.t0)}</span></div>`:""}</section>
  <div class="qwrap">
   <div class="qtop" dir="ltr">
     ${Z.modes?`<div class="modes"><button class="btn o" id="mE" aria-pressed="${mode==="exam"}">EXAM</button><button class="btn o" id="mP" aria-pressed="${mode==="practice"}">PRACTICE</button></div>`:""}
     <div class="hpbar" aria-hidden="true"><i style="width:${done/n*100}%"></i></div>
     <span class="qcount">Q ${i+1}/${n}</span>
     ${Z.exam?"":`<button class="btn b" id="keyB">ANSWER KEY</button>`}
   </div>
   <article class="qcard px fade">
     <div class="qtext"><span class="n">${i+1}.</span>${esc(q.q)}</div>
     <div class="opts">${q.o.map((o,j)=>{let c="";if(reveal){if(j===q.a)c="ok";else if(j===a)c="bad"}else if(answered&&j===a)c="pick";
       return `<button class="opt ${c}" data-j="${j}" ${reveal?"disabled":""}><span class="L">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
     ${reveal?`<div class="exp ${a===q.a?"":"wr"}"><span class="h">${a===q.a?"CORRECT +10 XP":"WRONG · ANSWER: "+"ABCD"[q.a]}</span><div class="body">${q.e}</div></div>`:""}
   </article>
   <div class="qnav" dir="ltr">
     <button class="btn o" id="prev" ${i===0?"disabled":""}>PREV</button>
     ${i<n-1?`<button class="btn" id="nxt">NEXT</button>`:`<button class="btn g" id="fin">FINISH</button>`}
   </div>
   ${n<=60?`<div class="dots" aria-label="Jump to question">${ans.map((x,j)=>`<button class="${x!==null?"done":""} ${j===i?"cur":""}" data-go="${j}" aria-label="Question ${j+1}">${j+1}</button>`).join("")}</div>`:""}
   <div><a class="btn o" href="${U(Z.back)}">BACK</a></div>
   ${Z.exam?"":`<details class="allq"><summary>كل الأسئلة بالإجابات والشرح (${n})</summary><div class="key">${keyList(Z,Array(n).fill(null),false)}</div></details>`}
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;renderQuiz()});
  const g=id=>document.getElementById(id);
  g("prev").onclick=()=>{S.i--;renderQuiz()};
  if(g("nxt"))g("nxt").onclick=()=>{S.i++;renderQuiz()};
  if(g("fin"))g("fin").onclick=finish;
  if(g("keyB"))g("keyB").onclick=()=>renderKey(false);
  if(Z.modes){g("mP").onclick=()=>{if(S.mode==="practice")return;S.mode="practice";S.ans.fill(null);S.i=0;renderQuiz();say("وضع التدريب: الإجابة هتظهر بعد كل سؤال.","think")};
    g("mE").onclick=()=>{if(S.mode==="exam")return;S.mode="exam";S.ans.fill(null);S.i=0;renderQuiz();say("وضع الامتحان: الإجابات في الآخر.","think")}}
}
function finish(){const left=S.ans.filter(x=>x===null).length;
  if(left&&S.mode==="exam"&&!S.confirm){S.confirm=true;say(`لسه فاضل <b>${left}</b> سؤال من غير إجابة. دوس FINISH تاني لو عايز تسلم.`,"sad");return}
  S.done=true;stopTimer();S.t1=Date.now();renderQuiz();window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pick(j){
  const q=S.Z.qs[S.i];
  if(S.mode==="practice"){if(S.ans[S.i]!==null)return;S.ans[S.i]=j;
    if(j===q.a){addXP(10);const m=["صح! كمّل كده.","برافو، +10 XP.","إجابة بطل!","تمام كده، اللي بعده."];say(m[Math.floor(Math.random()*m.length)],"happy")}
    else say(`لأ، الإجابة الصح <b>${"ABCD"[q.a]}</b>. اقرا الشرح تحت.`,"sad");
    renderQuiz();const exp=app.querySelector(".exp");if(exp)exp.scrollIntoView({block:"nearest",behavior:"smooth"});
  }else{S.ans[S.i]=j;S.confirm=false;if(S.i<S.Z.qs.length-1){S.i++}renderQuiz()}
}
function renderResult(){
  const {Z,ans}=S;const n=Z.qs.length;const s=Z.qs.reduce((c,q,i)=>c+(ans[i]===q.a),0);const p=s/n;
  if(S.mode==="exam")addXP(s*10);
  const rank=p>=.9?"S":p>=.75?"A":p>=.6?"B":p>=.5?"C":"D";
  const prev=store.get("best:"+S.id,null);if(!prev||s>prev.s)store.set("best:"+S.id,{s,t:n});
  const brk=Z.exam?ORDER.map(k=>{const idx=Z.qs.map((q,i)=>i).filter(i=>Z.qs[i].lec===k);const c=idx.filter(i=>ans[i]===Z.qs[i].a).length;return {k,c,t:idx.length}}):[];
  const weak=brk.filter(b=>b.t&&b.c/b.t<.6).map(b=>"L"+b.k);
  app.innerHTML=`<section class="page-head"><span class="eyebrow" dir="ltr">${Z.title} · RESULT</span>${Z.exam?`<div class="cta" dir="ltr"><span class="excode">CODE ${Z.code}</span><span class="timer">TIME ${fmt((S.t1||Date.now())-S.t0)}</span></div>`:""}</section>
  <div class="result px fade"><div style="font-family:var(--f-pixel);font-size:10px;color:var(--muted)">RANK</div><div class="rank">${rank}</div>
  <div class="score" dir="ltr">${s} / ${n}</div>
  <p>${p>=.75?"ممتاز! انت جاهز.":p>=.5?"كويس، راجع الأسئلة اللي غلطت فيها تحت.":"محتاج تراجع الشرح تاني وتعيد."}</p>
  ${Z.exam?`<div class="brk">${brk.map(b=>`<div><span>LECTURE ${b.k}</span><i><b style="width:${b.t?b.c/b.t*100:0}%"></b></i><span>${b.c}/${b.t}</span></div>`).join("")}</div>
  ${weak.length?`<p>ركز في مراجعة: <b dir="ltr">${weak.join(" · ")}</b></p>`:""}`:""}
  <div class="cta" dir="ltr">${Z.exam?`<button class="btn" id="again">NEW EXAM</button>`:`<button class="btn" id="again">PLAY AGAIN</button>`}<button class="btn b" id="rev">REVIEW ANSWERS</button><a class="btn o" href="${U(Z.exam?"home":Z.back)}">BACK</a></div></div>`;
  say(p>=.75?`جبت ${s} من ${n}. Rank ${rank}!`:`جبت ${s} من ${n}. راجع الشرح وجرب تاني.`,p>=.6?"happy":"sad");
  document.getElementById("again").onclick=()=>Z.exam?startExam(newCode()):viewQuiz(S.id);
  document.getElementById("rev").onclick=()=>renderKey(true);
}
function keyList(Z,ans,withMine){return Z.qs.map((q,i)=>{const mine=ans[i];const wrong=withMine&&mine!==null&&mine!==q.a;const skipped=withMine&&mine===null;
  return `<div class="krow"><div class="q"><span class="n">${i+1}.</span>${esc(q.q)}${Z.exam?` <span class="qsec" style="display:inline">L${q.lec}</span>`:""}</div>
  ${wrong?`<div class="a x">${"ABCD"[mine]}) ${esc(q.o[mine])}</div>`:""}${skipped?`<div class="a x">NO ANSWER</div>`:""}
  <div class="a">${"ABCD"[q.a]}) ${esc(q.o[q.a])}</div><div class="ex">${q.e}</div></div>`}).join("")}
function renderKey(withMine){
  const {Z,ans}=S;
  app.innerHTML=`<section class="page-head"><span class="eyebrow" dir="ltr">${Z.title} · ANSWER KEY</span><h1 dir="ltr" style="font-size:clamp(16px,3vw,22px)">${Z.ar}</h1>
  <div class="cta" dir="ltr"><button class="btn" id="bk">${withMine?"RESULT":"BACK TO QUIZ"}</button></div></section>
  <div class="key fade">${keyList(Z,ans,withMine)}</div>`;
  window.scrollTo(0,0);
  document.getElementById("bk").onclick=()=>{renderQuiz();window.scrollTo(0,0)};
  say("دي كل الإجابات مع الشرح. ذاكرها كويس.","think");
}

const PAGE_TITLE="Web Design Pixel Quest | شرح وحل Web Design";
function route(){
  cancelAnimationFrame(walkRAF);stopTimer();
  const h=STATIC?ROUTE_META.content:(location.hash||"#home").slice(1);
  navEl.querySelectorAll("a").forEach(a=>{const on=a.dataset.h===h||(h.startsWith("quiz-")&&a.dataset.h==="lec-"+h.slice(5));a.classList.toggle("on",on)});
  const lk=h.startsWith("lec-")?h.slice(4):null;
  document.title=lk&&LECS[lk]?`${LECS[lk].title} | ${LECS[lk].ar} | Web Design`:QUIZZES[h]?`${QUIZZES[h].title} | ${QUIZZES[h].ar} | Web Design`:h==="exam"?"Final Exam | الاختبار الشامل | Web Design":PAGE_TITLE;
  if(lk&&LECS[lk])viewLesson(lk);
  else if(QUIZZES[h])viewQuiz(h);

  else viewHome();
  const on=navEl.querySelector("a.on");if(on)on.scrollIntoView({inline:"nearest",block:"nearest"});
}
if(!STATIC)addEventListener("hashchange",route);
if(STATIC)document.querySelector(".bar .logo").href="/";
route();
